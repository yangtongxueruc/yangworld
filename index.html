          m.position.set(px * scale, py * scale, pz * scale);
          m.castShadow = true;
          m.renderOrder = 1500;
          g.add(m);
        });
        g.position.set(x, y, z);
        dioramaGroup.add(g);
        clouds.push({ group: g, speedX, speedZ });
      }

      // Base iconic cloud + randomly add 0–2 extra fluffy clouds (total 1–3 clouds)
      function populateClouds() {
        clouds.forEach(c => dioramaGroup.remove(c.group));
        clouds.length = 0;

        // Primary signature cloud near upper-right
        createCloud(3.8, 5.4, -6.7, 1.02, 0.18, 0.02);

        const extraCount = Math.floor(Math.random() * 3); // 0, 1, or 2 extra clouds
        const extraSlots = [
          { x: -8.6 + (Math.random() - 0.5) * 2.8, y: 5.7, z: -5.1 + (Math.random() - 0.5) * 1.6, s: 0.82 + Math.random() * 0.24, sx: 0.14 + Math.random() * 0.06, sz: 0.015 },
          { x: 8.2 + (Math.random() - 0.5) * 2.6,  y: 5.2, z: 5.6 + (Math.random() - 0.5) * 1.4,  s: 0.86 + Math.random() * 0.24, sx: 0.16 + Math.random() * 0.06, sz: 0.02 }
        ];
        // Shuffle extra slots when picking 1 so its position varies naturally
        if (Math.random() < 0.5) extraSlots.reverse();
        for (let i = 0; i < extraCount; i++) {
          const sl = extraSlots[i];
          createCloud(sl.x, sl.y, sl.z, sl.s, sl.sx, sl.sz);
        }
      }
      populateClouds();

      // ------------------------------------------------------------------
      // 6. Articulated Matte-Clay Sheep Flock
      // ------------------------------------------------------------------
      const woolMat = new THREE.MeshStandardMaterial({
        color: 0xfcfaf5,
        bumpMap: feltBumpTex,
        bumpScale: 0.022,
        roughness: 0.95,
        metalness: 0.0
      });
      const woolWarmMat = new THREE.MeshStandardMaterial({
        color: 0xf4efe4,
        bumpMap: feltBumpTex,
        bumpScale: 0.022,
        roughness: 0.95,
        metalness: 0.0
      });
      const faceMat = new THREE.MeshStandardMaterial({
        color: 0x2b2825,
        bumpMap: feltBumpTex,
        bumpScale: 0.012,
        roughness: 0.88,
        metalness: 0.0
      });
      const cheekMat = new THREE.MeshStandardMaterial({
        color: 0xf2a7b3,
        roughness: 0.90,
        metalness: 0.0
      });
      const eyeMat = new THREE.MeshBasicMaterial({ color: 0x18181b });

      // Crisp cartoon '?' texture for Idle look-up animation
      function createQuestionMarkTexture() {
        const c = document.createElement('canvas');
        c.width = 224;
        c.height = 224;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 224, 224);

        // Generous padding so thick white sticker outline & drop shadow never clip
        ctx.save();
        ctx.font = '800 112px "Inter", "PingFang SC", "Hiragino Sans GB", sans-serif';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';
        ctx.lineJoin = 'round';
        ctx.lineCap = 'round';

        ctx.shadowColor = 'rgba(15, 23, 42, 0.22)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 6;

        ctx.lineWidth = 24;
        ctx.strokeStyle = '#ffffff';
        ctx.strokeText('?', 112, 118);

        ctx.shadowColor = 'transparent';
        ctx.fillStyle = '#2563eb';
        ctx.fillText('?', 112, 118);
        ctx.restore();

        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }
      const questionMarkTex = createQuestionMarkTexture();

      // Cute cartoon angry mark ('💢' style) texture with white sticker outline
      function createAngryMarkTexture() {
        const c = document.createElement('canvas');
        c.width = 160;
        c.height = 160;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 160, 160);

        function drawAngerPaths(strokeStyle, lineWidth, withShadow) {
          ctx.save();
          ctx.translate(80, 80);
          ctx.strokeStyle = strokeStyle;
          ctx.lineWidth = lineWidth;
          ctx.lineCap = 'round';
          ctx.lineJoin = 'round';
          if (withShadow) {
            ctx.shadowColor = 'rgba(15, 23, 42, 0.24)';
            ctx.shadowBlur = 10;
            ctx.shadowOffsetY = 5;
          }
          // 4 symmetric anime anger-vein L-curves
          const corners = [
            [-1, -1],
            [1, -1],
            [1, 1],
            [-1, 1]
          ];
          corners.forEach(([sx, sy]) => {
            ctx.beginPath();
            ctx.moveTo(sx * 44, sy * 16);
            ctx.quadraticCurveTo(sx * 16, sy * 16, sx * 16, sy * 44);
            ctx.stroke();
          });
          ctx.restore();
        }

        // Thick white sticker border + shadow
        drawAngerPaths('#ffffff', 28, true);
        // Cute coral-red inner cartoon strokes
        drawAngerPaths('#ef4444', 14, false);

        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }
      const angryMarkTex = createAngryMarkTexture();

      // Cute glossy pink cartoon heart texture ('💗' style) with white sticker outline
      function createHeartTexture() {
        const c = document.createElement('canvas');
        c.width = 224;
        c.height = 224;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 224, 224);

        function traceHeart(scale) {
          ctx.beginPath();
          ctx.moveTo(0, 34 * scale);
          ctx.bezierCurveTo(-58 * scale, -6 * scale, -66 * scale, -52 * scale, -28 * scale, -56 * scale);
          ctx.bezierCurveTo(-8 * scale, -58 * scale, 0, -40 * scale, 0, -30 * scale);
          ctx.bezierCurveTo(0, -40 * scale, 8 * scale, -58 * scale, 28 * scale, -56 * scale);
          ctx.bezierCurveTo(66 * scale, -52 * scale, 58 * scale, -6 * scale, 0, 34 * scale);
          ctx.closePath();
        }

        ctx.save();
        ctx.translate(112, 122);

        // Soft pulsing outer pink aura rings
        ctx.strokeStyle = 'rgba(244, 114, 182, 0.42)';
        ctx.lineWidth = 6;
        traceHeart(1.42);
        ctx.stroke();

        // Thick white sticker border + soft shadow
        ctx.shadowColor = 'rgba(15, 23, 42, 0.22)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 5;
        ctx.lineWidth = 22;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        traceHeart(1.0);
        ctx.stroke();

        // Warm rosy-pink heart fill
        ctx.shadowColor = 'transparent';
        const grad = ctx.createLinearGradient(0, -56, 0, 36);
        grad.addColorStop(0, '#fb7185');
        grad.addColorStop(1, '#ec4899');
        ctx.fillStyle = grad;
        traceHeart(1.0);
        ctx.fill();

        // Cute glossy highlight dot
        ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
        ctx.beginPath();
        ctx.ellipse(-22, -32, 11, 6, -0.5, 0, Math.PI * 2);
        ctx.fill();

        ctx.restore();
        const tex = new THREE.CanvasTexture(c);
        tex.encoding = THREE.sRGBEncoding;
        return tex;
      }
      const heartMarkTex = createHeartTexture();

      // Cute glossy cartoon flame texture ('🔥' style) with white sticker outline
      function createFireTexture() {
        const c = document.createElement('canvas');
        c.width = 224;
        c.height = 224;
        const ctx = c.getContext('2d');
        ctx.clearRect(0, 0, 224, 224);

        function traceOuterFlame() {
          ctx.beginPath();
          ctx.moveTo(0, 62);
          ctx.bezierCurveTo(-52, 62, -62, 16, -42, -16);
          ctx.bezierCurveTo(-34, -28, -22, -26, -24, -12);
          ctx.bezierCurveTo(-18, -42, -2, -64, 12, -74);
          ctx.bezierCurveTo(6, -48, 22, -36, 36, -18);
          ctx.bezierCurveTo(58, 12, 54, 62, 0, 62);
          ctx.closePath();
        }

        function traceInnerFlame() {
          ctx.beginPath();
          ctx.moveTo(0, 56);
          ctx.bezierCurveTo(-26, 56, -32, 28, -18, 8);
          ctx.bezierCurveTo(-12, 0, -6, 4, -8, 12);
          ctx.bezierCurveTo(-4, -8, 6, -22, 12, -26);
          ctx.bezierCurveTo(10, -10, 20, -2, 24, 14);
          ctx.bezierCurveTo(32, 34, 24, 56, 0, 56);
          ctx.closePath();
        }

        ctx.save();
        ctx.translate(112, 118);

        // Thick white sticker border + soft drop shadow
        ctx.shadowColor = 'rgba(15, 23, 42, 0.24)';
        ctx.shadowBlur = 12;
        ctx.shadowOffsetY = 5;
        ctx.lineWidth = 22;
        ctx.lineJoin = 'round';
        ctx.strokeStyle = '#ffffff';
        traceOuterFlame();

      function startPairInteraction(sheepA, sheepB, type) {
        if (sheepA.pairInteraction) clearPairInteraction(sheepA.pairInteraction);
        if (sheepB.pairInteraction) clearPairInteraction(sheepB.pairInteraction);

        sheepA.angerTimer = 0;
        sheepB.angerTimer = 0;
        sheepA.vaultTime = 0;
        sheepB.vaultTime = 0;

        // Place them comfortably facing head-to-head at an ideal spacing
        let dx = sheepB.root.position.x - sheepA.root.position.x;
        let dz = sheepB.root.position.z - sheepA.root.position.z;
        let dist = Math.hypot(dx, dz);
        if (dist < 0.05) {
          dx = 1;
          dz = 0;
          dist = 1;
        }
        const nx = dx / dist;
        const nz = dz / dist;
        const idealDist = type === 'love' ? 1.12 : 1.24;
        const targetAx = sheepB.root.position.x - nx * idealDist;
        const targetAz = sheepB.root.position.z - nz * idealDist;
        if (!isPositionBlocked(targetAx, targetAz, 0)) {
          sheepA.root.position.x = targetAx;
          sheepA.root.position.z = targetAz;
        }

        const fxGroup = new THREE.Group();
        dioramaGroup.add(fxGroup);

        const inter = {
          a: sheepA,
          b: sheepB,
          type, // 'love' | 'fight'
          timer: 5.0,
          elapsed: 0,
          fxGroup,
          heartSprite: null,
          fireSprite: null,
          dustPuffs: []
        };

        if (type === 'love') {
          const hMat = new THREE.SpriteMaterial({
            map: heartMarkTex,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
          });
          const hSprite = new THREE.Sprite(hMat);
          hSprite.renderOrder = 1000;
          hSprite.scale.set(0.01, 0.01, 1);
          fxGroup.add(hSprite);
          inter.heartSprite = hSprite;
        } else {
          // Bigger, plumper swirling cartoon dust/fog cloud puffs for the headbutt fight
          for (let k = 0; k < 14; k++) {
            const pMat = fightDustMats[k % fightDustMats.length].clone();
            const puff = new THREE.Mesh(fightDustGeo, pMat);
            puff.castShadow = false;
            fxGroup.add(puff);
            inter.dustPuffs.push({
              mesh: puff,
              angle: (k / 14) * Math.PI * 2,
              radius: 0.24 + (k % 4) * 0.18,
              baseY: 0.28 + (k % 4) * 0.23,
              speed: 2.4 + (k % 3) * 0.85,
              scaleBase: 0.92 + (k % 4) * 0.28,
              phase: k * 0.85
            });
          }

          // Cute cartoon '🔥' sprite popping up directly above the clash
          const fMat = new THREE.SpriteMaterial({
            map: fireMarkTex,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
          });
          const fSprite = new THREE.Sprite(fMat);
          fSprite.renderOrder = 1000;
          fSprite.scale.set(0.01, 0.01, 1);
          fxGroup.add(fSprite);
          inter.fireSprite = fSprite;
        }

        sheepA.pairInteraction = inter;
        sheepB.pairInteraction = inter;
        pairInteractions.push(inter);
      }

      // ------------------------------------------------------------------
      // 6.4 Sheepdog-Cat Herding -> Shearing -> ??? -> Cottage Door Event
      // ------------------------------------------------------------------
      let herdingEvent = null;
      let herdingCooldown = 0;

      function clearHerdingEvent() {
        if (!herdingEvent) return;
        if (herdingEvent.sheep) herdingEvent.sheep.herded = false;
        if (herdingEvent.fxGroup) dioramaGroup.remove(herdingEvent.fxGroup);
        herdingEvent = null;
      }

      function startHerdingEvent(sheep) {
        if (herdingEvent || !goldenCat || !sheep || sheep.deleting || sheep.isCat || sheep.grabbed || sheep.hasSweater) return false;
        if (sheep.pairInteraction) clearPairInteraction(sheep.pairInteraction);

        goldenCat.angerTimer = 0;
        goldenCat.boltingTimer = 0;
        goldenCat.wakeStretchTimer = 0;
        goldenCat.watchFish = null;
        goldenCat.reefAction = null;

        sheep.angerTimer = 0;
        sheep.scaredTimer = 0;
        sheep.fleePenTimer = 0;
        sheep.vaultTime = 0;
        sheep.herded = true;

        const waypoints = [];
        const onLeftBank = sheep.root.position.x < getRiverCenterX(sheep.root.position.z);
        if (onLeftBank) {
          waypoints.push({ x: BRIDGE_X - BRIDGE_SPAN * 0.5 - 0.55, z: BRIDGE_Z });
          waypoints.push({ x: BRIDGE_X + BRIDGE_SPAN * 0.5 + 0.65, z: BRIDGE_Z });
        }
        const gateX = PEN_X;
        const gateZ = PEN_Z + PEN_D * 0.5 + 0.65;
        const shearSpotX = PEN_X - 1.15;
        const shearSpotZ = PEN_Z + 0.35;
        waypoints.push({ x: gateX, z: gateZ });
        waypoints.push({ x: shearSpotX, z: shearSpotZ });

        const cosH = Math.cos(-0.18);
        const sinH = Math.sin(-0.18);
        function houseLocalToWorld(lx, lz) {
          return {
            x: HOUSE_X + lx * cosH + lz * sinH,
            z: HOUSE_Z - lx * sinH + lz * cosH
          };
        }
        const doorstep = houseLocalToWorld(-0.36, 1.35);
        const insideDoor = houseLocalToWorld(-0.36, 0.45);

        const fxGroup = new THREE.Group();
        dioramaGroup.add(fxGroup);

        herdingEvent = {
          sheep,
          cat: goldenCat,
          stage: 'herd',
          timer: 0,
          waypoints,
          wpIdx: 0,
          guardPos: { x: gateX + 0.35, z: gateZ + 0.45 },
          shearSpot: { x: shearSpotX, z: shearSpotZ },
          doorstep,
          insideDoor,
          doorAngle: 0,
          fxGroup,
          mistPuffs: [],
          qBurstSprites: []
        };
        herdingCooldown = 18.0;
        if (selectedSheep === sheep) selectSheep(null);
        return true;
      }

      function spawnShearingMist(ev) {
        const geo = new THREE.SphereGeometry(0.34, 10, 8);
        for (let k = 0; k < 14; k++) {
          const mat = new THREE.MeshStandardMaterial({
            color: k % 2 === 0 ? 0xffffff : 0xf4efe6,
            roughness: 0.96,
            transparent: true,
            opacity: 0
          });
          const m = new THREE.Mesh(geo, mat);
          ev.fxGroup.add(m);
          ev.mistPuffs.push({
            mesh: m,
            angle: (k / 14) * Math.PI * 2,
            radius: 0.25 + (k % 4) * 0.18,
            baseY: 0.28 + (k % 4) * 0.22,
            speed: 2.5 + (k % 3) * 0.85,
            scale: 0.85 + (k % 3) * 0.30,
            phase: k * 0.7
          });
        }
      }

      function spawnConfusedQuestions(ev) {
        for (let k = 0; k < 7; k++) {
          const mat = new THREE.SpriteMaterial({
            map: questionMarkTex,
            transparent: true,
            opacity: 0,
            depthTest: false,
            depthWrite: false
          });
          const sp = new THREE.Sprite(mat);
          sp.renderOrder = 1000;
          sp.scale.set(0.01, 0.01, 1);
          ev.fxGroup.add(sp);
          ev.qBurstSprites.push({
            sprite: sp,
            offX: (k - 3) * 0.26 + (Math.random() - 0.5) * 0.16,
            offZ: (Math.random() - 0.5) * 0.45,
            delay: k * 0.24,
            speed: 0.65 + (k % 3) * 0.22,
            size: 0.54 + (k % 3) * 0.14
          });
        }
      }

      function updateHerdingEvent(dt, elapsed) {
        if (herdingCooldown > 0) herdingCooldown = Math.max(0, herdingCooldown - dt);
        // Handle any sheared sheep returning from the cottage wearing a cozy little sweater!
        if (!herdingEvent && sweaterReturnQueue.length > 0) {
          const sr = sweaterReturnQueue[0];
          if (sr.stage === 'wait') {
            sr.timer -= dt;
            if (sr.timer <= 0 && sheepList.length < 24) {
              sr.stage = 'open';
              sr.timer = 0.7;
            }
          } else if (sr.stage === 'open') {
            if (cottageDoorPivot) cottageDoorPivot.rotation.y += (-Math.PI * 0.62 - cottageDoorPivot.rotation.y) * Math.min(1, dt * 7);
            sr.timer -= dt;
            if (sr.timer <= 0) {
              const s = createSheep(sr.insideDoor.x, sr.insideDoor.z, Math.atan2(sr.doorstep.x - sr.insideDoor.x, sr.doorstep.z - sr.insideDoor.z), 'Walk', true);
              s.herded = true;
              s.exitingCottage = true;
              s.spawnScale = 0.35;
              sr.sheep = s;
              sr.stage = 'exit';
              sr.exitStage = 0;
            }
          } else if (sr.stage === 'exit' && sr.sheep) {
            // 3 clean waypoints: doorstep -> pen gate -> well outside pen into open meadow!
            const exitWaypoints = [
              sr.doorstep,
              { x: PEN_X, z: PEN_Z + PEN_D * 0.5 + 0.55 },
              { x: PEN_X - 0.6, z: PEN_Z + PEN_D * 0.5 + 2.65 }
            ];
            const target = exitWaypoints[sr.exitStage];
            const dx = target.x - sr.sheep.root.position.x;
            const dz = target.z - sr.sheep.root.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.22) {
              sr.sheep.root.position.x += (dx / dist) * 1.85 * dt;
              sr.sheep.root.position.z += (dz / dist) * 1.85 * dt;
              sr.sheep.targetRotY = Math.atan2(dx, dz);
            } else if (sr.exitStage < exitWaypoints.length - 1) {
              sr.exitStage++;
            } else {
              sr.sheep.exitingCottage = false;
              sr.sheep.herded = false;
              sr.sheep.fleePenCooldown = 6.0;
              sr.sheep.avoidCooldown = 0.5;
              sr.sheep.targetRotY = (Math.random() - 0.5) * 0.9;
              sr.stage = 'close';
              sr.timer = 1.0;
              showToast('剃完毛的小羊穿着小毛衣溜出来啦！');
            }
          } else if (sr.stage === 'close') {
            if (cottageDoorPivot) cottageDoorPivot.rotation.y += (0 - cottageDoorPivot.rotation.y) * Math.min(1, dt * 7);
            sr.timer -= dt;
            if (sr.timer <= 0) sweaterReturnQueue.shift();
          }
        }

        if (!herdingEvent) {
          if (cottageDoorPivot && (sweaterReturnQueue.length === 0 || sweaterReturnQueue[0].stage === 'wait')) {
            cottageDoorPivot.rotation.y += (0 - cottageDoorPivot.rotation.y) * Math.min(1, dt * 6);
          }
          return;
        }

        const ev = herdingEvent;
        const sh = ev.sheep;
        const cat = ev.cat;
        if (!cat || cat.grabbed || (ev.stage !== 'door_close' && (!sh || sh.deleting || sh.grabbed))) {
          clearHerdingEvent();
          return;
        }

        ev.timer += dt;

        if (cottageDoorPivot) {
          cottageDoorPivot.rotation.y += (ev.doorAngle - cottageDoorPivot.rotation.y) * Math.min(1, dt * 7);
        }

        if (ev.stage === 'herd') {
          const wp = ev.waypoints[ev.wpIdx];
          const dx = wp.x - sh.root.position.x;
          const dz = wp.z - sh.root.position.z;
          const dist = Math.hypot(dx, dz);

          if (dist < 0.35) {
            ev.wpIdx++;
            if (ev.wpIdx >= ev.waypoints.length) {
              ev.stage = 'shiver';
              ev.timer = 0;
              return;
            }
          } else {
            const nx = dx / dist;
            const nz = dz / dist;
            sh.root.position.x += nx * 2.75 * dt;
            sh.root.position.z += nz * 2.75 * dt;
            sh.targetRotY = Math.atan2(nx, nz);

            const weave = Math.sin(elapsed * 5.2) * 0.58;
            const behindX = sh.root.position.x - nx * 1.45 - nz * weave;
            const behindZ = sh.root.position.z - nz * 1.45 + nx * weave;
            const cdx = behindX - cat.root.position.x;
            const cdz = behindZ - cat.root.position.z;
            const cdist = Math.hypot(cdx, cdz);
            if (cdist > 0.12) {
              const cSpeed = Math.min(3.8, Math.max(2.6, cdist * 2.4));
              cat.root.position.x += (cdx / cdist) * cSpeed * dt;
              cat.root.position.z += (cdz / cdist) * cSpeed * dt;
              cat.targetRotY = Math.atan2(sh.root.position.x - cat.root.position.x, sh.root.position.z - cat.root.position.z);
            }
          }
        } else {
          const gdx = ev.guardPos.x - cat.root.position.x;
          const gdz = ev.guardPos.z - cat.root.position.z;
          const gdist = Math.hypot(gdx, gdz);
          if (gdist > 0.25) {
            cat.root.position.x += (gdx / gdist) * 2.4 * dt;
            cat.root.position.z += (gdz / gdist) * 2.4 * dt;
            cat.targetRotY = Math.atan2(gdx, gdz);
            ev.catGuarding = false;
          } else {
            ev.catGuarding = true;
            cat.targetRotY = 0.15;
          }

          if (ev.stage === 'shiver') {
            sh.targetRotY = Math.atan2(cat.root.position.x - sh.root.position.x, cat.root.position.z - sh.root.position.z);
            if (ev.timer >= 2.2) {
              ev.stage = 'shear';
              ev.timer = 0;
              spawnShearingMist(ev);
            }
          } else if (ev.stage === 'shear') {
            const p = ev.timer / 2.8;
            const vis = Math.min(1, p * 3.5) * Math.min(1, (1 - p) * 3.5);
            ev.mistPuffs.forEach(mp => {
              const a = mp.angle + ev.timer * mp.speed;
              const r = mp.radius * (0.85 + 0.3 * Math.sin(ev.timer * 7 + mp.phase));
              mp.mesh.position.set(
                sh.root.position.x + Math.cos(a) * r,
                sh.root.position.y + mp.baseY + Math.sin(ev.timer * 6 + mp.phase) * 0.16,
                sh.root.position.z + Math.sin(a) * r
              );
              mp.mesh.scale.setScalar(Math.max(0.01, mp.scale * vis));
              mp.mesh.material.opacity = 0.88 * vis;
            });

            if (ev.timer > 1.35 && !sh.sheared) {
              sh.sheared = true;
              sh.woolGroup.visible = false;
              sh.bareBodyMesh.visible = true;
            }

            if (ev.timer >= 2.8) {
              ev.mistPuffs.forEach(mp => ev.fxGroup.remove(mp.mesh));
              ev.mistPuffs.length = 0;
              ev.stage = 'confused';
              ev.timer = 0;
              spawnConfusedQuestions(ev);
            }
          } else if (ev.stage === 'confused') {
            ev.qBurstSprites.forEach(qb => {
              const localT = ev.timer - qb.delay;
              if (localT <= 0) {
                qb.sprite.visible = false;
                return;
              }
              const cycle = (localT * qb.speed) % 1.0;
              const fade = Math.sin(cycle * Math.PI);
              const env = Math.min(1, (2.7 - ev.timer) * 2.5);
              qb.sprite.visible = true;
              const sc = qb.size * (0.7 + 0.35 * fade) * Math.max(0, env);
              qb.sprite.scale.set(sc, sc, 1);
              qb.sprite.position.set(
                sh.root.position.x + qb.offX,
                sh.root.position.y + 1.25 + cycle * 1.15,
                sh.root.position.z + qb.offZ
              );
              qb.sprite.material.opacity = Math.max(0, fade * env);
              qb.sprite.material.rotation = Math.sin(ev.timer * 5 + qb.delay * 4) * 0.18;
            });

            if (ev.timer >= 2.7) {
              ev.qBurstSprites.forEach(qb => ev.fxGroup.remove(qb.sprite));
              ev.qBurstSprites.length = 0;
              ev.stage = 'door_open';
              ev.timer = 0;
              ev.doorAngle = -Math.PI * 0.62;
            }
          } else if (ev.stage === 'door_open') {
            sh.targetRotY = Math.atan2(ev.doorstep.x - sh.root.position.x, ev.doorstep.z - sh.root.position.z);
            if (ev.timer >= 0.75) {
              ev.stage = 'enter_house';
              ev.timer = 0;
              ev.reachedStep = false;
            }
          } else if (ev.stage === 'enter_house') {
            const target = ev.reachedStep ? ev.insideDoor : ev.doorstep;
            const dx = target.x - sh.root.position.x;
            const dz = target.z - sh.root.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist > 0.14) {
              sh.root.position.x += (dx / dist) * 1.55 * dt;
              sh.root.position.z += (dz / dist) * 1.55 * dt;
              sh.targetRotY = Math.atan2(dx, dz);
              if (ev.reachedStep) {
                sh.root.scale.setScalar(Math.max(0.15, dist / 0.95));
              }
            } else if (!ev.reachedStep) {
              ev.reachedStep = true;
            } else {
              dioramaGroup.remove(sh.root);
              const idx = sheepList.indexOf(sh);
              if (idx !== -1) sheepList.splice(idx, 1);
              if (selectedSheep === sh) selectSheep(null);
              if (hoveredSheep === sh) hoveredSheep = null;
              ev.sheep = null;
              ev.stage = 'door_close';
              ev.timer = 0;
              ev.doorAngle = 0;
              // Schedule this sheep to return ~28s later wearing a cozy little knit sweater!
              sweaterReturnQueue.push({ timer: 28.0, stage: 'wait', sheep: null, doorstep: ev.doorstep, insideDoor: ev.insideDoor });
            }
          } else if (ev.stage === 'door_close') {
            if (ev.timer >= 1.1) {
              clearHerdingEvent();
              if (goldenCat) {
                goldenCat.state = 'Walk';
                goldenCat.stateTimer = 7.5 + Math.random() * 3.0;
                // Stroll casually away from the sheep pen back toward the open meadow
                goldenCat.targetRotY = -2.25 + (Math.random() - 0.5) * 0.75;
                if (selectedSheep === goldenCat) syncToolbarActiveButton();
              }
            }
          }
        }
      }

      function updatePairInteractions(dt) {
        for (let i = pairInteractions.length - 1; i >= 0; i--) {
          const inter = pairInteractions[i];
          if (
            !inter.a || !inter.b ||
            inter.a.deleting || inter.b.deleting ||
            inter.a.grabbed || inter.b.grabbed
          ) {
            clearPairInteraction(inter);
            continue;
          }

          inter.elapsed += dt;
          inter.timer -= dt;
          if (inter.timer <= 0) {
            clearPairInteraction(inter);
            continue;
          }

          const midX = (inter.a.root.position.x + inter.b.root.position.x) * 0.5;
          const midZ = (inter.a.root.position.z + inter.b.root.position.z) * 0.5;
          const midY = (inter.a.root.position.y + inter.b.root.position.y) * 0.5;

          const fadeIn = Math.min(1, inter.elapsed * 3.5);
          const fadeOut = Math.min(1, inter.timer * 2.2);
          const vis = fadeIn * fadeOut;

          if (inter.type === 'love' && inter.heartSprite) {
            const pulse = 1 + Math.sin(inter.elapsed * 6.5) * 0.12;
            const sz = 0.92 * vis * pulse;
            inter.heartSprite.scale.set(sz, sz, 1);
            inter.heartSprite.position.set(
              midX,
              midY + 1.56 + Math.sin(inter.elapsed * 3.6) * 0.08,
              midZ
            );
            inter.heartSprite.material.opacity = vis;
            inter.heartSprite.material.rotation = Math.sin(inter.elapsed * 3.2) * 0.10;
          } else if (inter.type === 'fight') {
            inter.dustPuffs.forEach(p => {
              const a = p.angle + inter.elapsed * p.speed;
              const burst = 0.82 + 0.36 * Math.abs(Math.sin(inter.elapsed * 7.2 + p.phase));
              const r = p.radius * burst;
              p.mesh.position.set(
                midX + Math.cos(a) * r,
                midY + p.baseY + Math.sin(inter.elapsed * 5.8 + p.phase) * 0.18,
                midZ + Math.sin(a) * r
              );
              const sc = p.scaleBase * vis * (0.88 + 0.30 * Math.sin(inter.elapsed * 8.5 + p.phase));
              p.mesh.scale.setScalar(Math.max(0.01, sc));
              p.mesh.material.opacity = 0.84 * vis;
            });

            if (inter.fireSprite) {
              const flicker = 1 + Math.sin(inter.elapsed * 13.5) * 0.11;
              const sz = 0.96 * vis * flicker;
              inter.fireSprite.scale.set(sz, sz, 1);
              inter.fireSprite.position.set(
                midX,
                midY + 1.68 + Math.sin(inter.elapsed * 6.5) * 0.08,
                midZ
              );
              inter.fireSprite.material.opacity = vis;
              inter.fireSprite.material.rotation = Math.sin(inter.elapsed * 10.0) * 0.12;
            }
          }
        }
      }

      // Ground placement target ring shown while dragging a sheep
      const dropRingMat = new THREE.MeshBasicMaterial({
        color: 0x2563eb,
        transparent: true,
        opacity: 0.72,
        side: THREE.DoubleSide,
        depthWrite: false
      });
      const dropRingMesh = new THREE.Mesh(
        new THREE.RingGeometry(0.46, 0.62, 32),
        dropRingMat
      );
      dropRingMesh.rotation.x = -Math.PI / 2;
      dropRingMesh.visible = false;
      dioramaGroup.add(dropRingMesh);

      let sheepList = [];
      let nextSheepId = 1;
      let selectedSheep = null;
      let hoveredSheep = null;

      const SWEATER_COLORS = [0x60a5fa, 0xfb7185, 0x34d399, 0xa78bfa];
      function createSheep(x, z, rotY, initialState, withSweater) {
        const root = new THREE.Group();
        root.position.set(x, getGroundY(x, z), z);
        root.rotation.y = rotY;

        // Animated body pivot (handles bounce, jump elevation, squash & stretch)
        const bodyRig = new THREE.Group();
        bodyRig.scale.setScalar(1.16);
        root.add(bodyRig);

        // Cute slim shaved bare body (hidden under wool until sheared in the sheep pen!)
        const bareBodyMat = new THREE.MeshStandardMaterial({
          color: 0xf4cf65,
          roughness: 0.91,
          metalness: 0.0
        });
        const bareBodyMesh = new THREE.Group();
        const bareTorso = new THREE.Mesh(new THREE.SphereGeometry(0.24, 16, 12), bareBodyMat);
        bareTorso.scale.set(0.92, 0.86, 1.50);
        bareTorso.position.set(0, 0.46, -0.01);
        bareTorso.castShadow = true;
        bareBodyMesh.add(bareTorso);
        // Cute slim neck connecting bare torso seamlessly to headPivot
        const bareNeck = new THREE.Mesh(new THREE.CylinderGeometry(0.105, 0.135, 0.24, 10), bareBodyMat);
        bareNeck.position.set(0, 0.56, 0.29);
        bareNeck.rotation.x = 0.52;
        bareNeck.castShadow = true;
        bareBodyMesh.add(bareNeck);
        // Tiny stubby sheared tail
        const bareTail = new THREE.Mesh(new THREE.SphereGeometry(0.065, 8, 8), bareBodyMat);
        bareTail.position.set(0, 0.45, -0.36);
        bareBodyMesh.add(bareTail);
        bareBodyMesh.visible = false;
        bodyRig.add(bareBodyMesh);

        // Fluffy wool torso (cluster of soft spheres)
        const woolGroup = new THREE.Group();
        woolGroup.position.y = 0.56;
        bodyRig.add(woolGroup);

        const bodyPuffs = [
          [0, 0.02, 0, 0.36],
          [0, 0.05, 0.22, 0.30],
          [0, 0.04, -0.24, 0.30],
          [0.18, 0.02, 0.05, 0.25],
          [-0.18, 0.02, 0.05, 0.25],
          [0, 0.14, -0.02, 0.26],
          [0, -0.02, -0.42, 0.13] // little tail
        ];
        bodyPuffs.forEach(([px, py, pz, r], idx) => {
          const m = new THREE.Mesh(
            new THREE.SphereGeometry(r, 20, 16),
            idx % 3 === 1 ? woolWarmMat : woolMat
          );
          m.position.set(px, py, pz);
          m.castShadow = true;

        if (c.avoidCooldown > 0) c.avoidCooldown = Math.max(0, c.avoidCooldown - dt);
        if (c.disturbCooldown > 0) c.disturbCooldown = Math.max(0, c.disturbCooldown - dt);

        const turnRate = (c.grabbed || c.angerTimer > 0 || c.boltingTimer > 0) ? 14.0 : (c.avoidCooldown > 0 ? 9.5 : 5.5);
        c.root.rotation.y += shortestAngleDiff(c.root.rotation.y, c.targetRotY) * Math.min(1, dt * turnRate);
        const baseGY = c.onRoofTimer > 0 ? (getTerrainHeight(HOUSE_X, HOUSE_Z) + 2.18) : getGroundY(c.root.position.x, c.root.position.z);
        const targetGY = c.grabbed ? baseGY + 1.55 : baseGY;
        c.root.position.y += (targetGY - c.root.position.y) * Math.min(1, dt * (c.grabbed ? 18 : 14));

        if (c.dropSquash > 0) c.dropSquash = Math.max(0, c.dropSquash - dt * 4.0);

        if (c.watchCooldown > 0) c.watchCooldown = Math.max(0, c.watchCooldown - dt);
        if (c.reefCooldown > 0) c.reefCooldown = Math.max(0, c.reefCooldown - dt);

        function startCatReefJump(mode, alreadyOnReef) {
          const curBank = c.root.position.x >= getRiverCenterX(c.root.position.z) ? 1 : -1;
          const targetBankSide = mode === 'cross' ? -curBank : (Math.random() < 0.5 ? curBank : -curBank);
          c.watchFish = null;
          c.wakeStretchTimer = 0;
          c.reefAction = {
            mode, // 'sit' (sit on reef watching fish) | 'cross' (use reef as stepping stone to opposite bank)
            phase: alreadyOnReef ? 'perched' : 'jump_to_reef',
            t: 0,
            duration: 0.62,
            startX: c.root.position.x,
            startY: c.root.position.y,
            startZ: c.root.position.z,
            endX: REEF_X,
            endY: REEF_TOP_Y,
            endZ: REEF_Z,
            targetBankSide,
            perchTimer: mode === 'sit' ? (5.5 + Math.random() * 3.5) : 0.42
          };
        }

        // Autonomous trigger: when cat is walking or near the riverbank close to the river reef, jump onto it to watch fish or cross to the opposite bank!
        if (
          !c.grabbed && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.reefAction &&
          c.reefCooldown <= 0 && (c.state === 'Walk' || c.watchFish)
        ) {
          const distReef = Math.hypot(c.root.position.x - REEF_X, c.root.position.z - REEF_Z);
          if (distReef < 3.45 && !isOnReef(c.root.position.x, c.root.position.z, 0.1)) {
            c.reefCooldown = 14.0;
            if (Math.random() < 0.68) {
              const mode = Math.random() < 0.52 ? 'sit' : 'cross';
              startCatReefJump(mode, false);
            }
          }
        }

        // Check if cat is near the riverbank and spots a swimming fish -> enter excited fish-watching/stalking mode!
        if (!c.grabbed && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.reefAction && !isOnBridge(c.root.position.x, c.root.position.z, 0.2)) {
          const distToRiverEdge = Math.abs(c.root.position.x - getRiverCenterX(c.root.position.z)) - getRiverHalfWidth(c.root.position.z);
          if (!c.watchFish && c.watchCooldown <= 0 && distToRiverEdge < 2.8 && fishList.length > 0) {
            let bestFish = null;
            let bestD = 4.8;
            for (let i = 0; i < fishList.length; i++) {
              const f = fishList[i];
              if (f.mat.opacity < 0.2) continue;
              const d = Math.hypot(
                f.group.position.x - c.root.position.x,
                f.group.position.z - c.root.position.z
              );
              if (d < bestD) {
                bestD = d;
                bestFish = f;
              }
            }
            if (bestFish) {
              c.watchFish = bestFish;
              c.watchTimer = 8.0;
              c.wakeStretchTimer = 0;
            }
          }
        }

        if (c.pounceCooldown > 0) c.pounceCooldown = Math.max(0, c.pounceCooldown - dt);
        if (c.petEnergy > 0) c.petEnergy = Math.max(0, c.petEnergy - dt * 0.65);

        // Spot a fluttering butterfly nearby -> enter classic butt-wiggle pounce!
        if (!c.grabbed && c.angerTimer <= 0 && c.boltingTimer <= 0 && !c.watchFish && !c.reefAction && !herdingEvent && !c.butterflyHunt && c.onRoofTimer <= 0 && c.pounceCooldown <= 0 && c.state !== 'Sleep') {
          for (let i = 0; i < butterflies.length; i++) {
            const bf = butterflies[i];
            const d = Math.hypot(bf.group.position.x - c.root.position.x, bf.group.position.z - c.root.position.z);
            if (d < 3.4) {
              c.pounceCooldown = 14.0;
              if (Math.random() < 0.55) {
                c.butterflyHunt = { target: bf, phase: 'wiggle', t: 0 };
              }
              break;
            }
          }
        }

        if (!c.grabbed && c.angerTimer <= 0 && c.wakeStretchTimer <= 0 && c.boltingTimer <= 0 && !c.watchFish && !c.reefAction && !herdingEvent && !c.butterflyHunt && c.onRoofTimer <= 0 && c.purrTimer <= 0) {
          c.stateTimer -= dt;
          if (c.stateTimer <= 0) {
            if (c.state === 'Sleep') {
              // Wake up naturally -> big stretch -> scratch claws!
              c.wakeStretchTimer = 2.4;
              c.state = 'Scratch';
              c.stateTimer = 5.5 + Math.random() * 3.0;
            } else {
              const ids = CAT_STATES.map(s => s.id).filter(id => id !== c.state);
              c.state = ids[(Math.random() * ids.length) | 0];
              c.stateTimer = c.state === 'Sleep'
                ? (30 + Math.random() * 15)
                : (5.5 + Math.random() * 4.5);
            }
            if (selectedSheep === c) syncToolbarActiveButton();
          }
        }

        if (c.state === 'Sleep' && c.angerTimer <= 0 && c.disturbCooldown <= 0) {
          for (let i = 0; i < sheepList.length; i++) {
            const sh = sheepList[i];
            if (sh.deleting || sh.grabbed) continue;
            const d = Math.hypot(
              sh.root.position.x - c.root.position.x,
              sh.root.position.z - c.root.position.z
            );
            if (d < 1.32) {
              c.angerTimer = 3.2;
              c.angerTarget = sh;
              c.disturbCooldown = 12.0;
              // Offending sheep gets embarrassed & scared!
              sh.scaredTimer = 3.2;
              sh.scaredTarget = c;
              sh.angerTimer = 0;
              sh.vaultTime = 0;
              break;
            }
          }
        }

        let bodyY = 0.0;
        let bodyPitch = 0.0;
        let bodyRoll = 0.0;
        let torsoY = 0.36;
        let torsoPitch = 0.0;
        let torsoSX = 1.0, torsoSY = 1.0, torsoSZ = 1.0;
        let headX = 0.0, headY = 0.0, headZ = 0.0;
        let earFlatten = 0.0;
        let tailBaseX = 0.35, tailBaseY = 0.0;
        let tailTipX = 0.45, tailTipY = 0.0;
        let legRotX = [0, 0, 0, 0];
        let legRotZ = [0, 0, 0, 0];
        let legY = [0.30, 0.30, 0.30, 0.30];
        let eyesClosed = false;
        let showZzz = false;
        let showAngry = false;
        let showFishCrave = false;
        let showShield = false;
        let showPurr = false;

        if (c.grabbed) {
          // Authentic scruff-held posture: hangs upright facing straight toward camera (head + belly + 4 tucked paws clearly visible!)
          c.targetRotY = Math.atan2(
            camera.position.x - c.root.position.x,
            camera.position.z - c.root.position.z
          );
          // Pitch whole body upright so the creamy belly & chest face straight at the viewer
          bodyY = 0.24;
          bodyPitch = -1.16;
          bodyRoll = Math.sin(t * 4.4) * 0.09;
          torsoY = 0.36;
          torsoPitch = 0.0;
          torsoSZ = 1.08;
          torsoSX = 0.95;
          // Counter-tilt head forward so face & green eyes stare straight out at the viewer
          headX = 0.88;
          headY = Math.sin(t * 2.8) * 0.10;
          earFlatten = 0.22;
          // All 4 paws tucked snugly in front of chest & lower belly (clearly visible from front!)
          legY = [0.25, 0.25, 0.25, 0.25];
          legRotX = [-0.52 + Math.sin(t * 5.2) * 0.08, -0.52 - Math.sin(t * 5.2) * 0.08, -0.88, -0.88];
          legRotZ = [0.34, -0.34, 0.22, -0.22];
          // Tail curls forward right between the tucked hind paws
          tailBaseX = -1.25;
          tailBaseY = 0.38;
          tailTipX = -0.70;
          tailTipY = 0.30;
        } else if (herdingEvent && herdingEvent.cat === c) {
          if (herdingEvent.stage === 'herd' || !herdingEvent.catGuarding) {
            const gp = t * 17.5;
            const fSw = Math.sin(gp) * 0.82;
            const bSw = Math.sin(gp + 2.3) * 0.82;
            legRotX = [fSw, -fSw, bSw, -bSw];
            bodyY = Math.abs(Math.sin(gp)) * 0.11;
            torsoPitch = 0.14;
            torsoSZ = 1.14;
            headX = -0.10;
            tailBaseX = 0.85;
            tailBaseY = Math.sin(gp) * 0.30;
          } else {
            showShield = true;
            torsoY = 0.34;
            torsoPitch = -0.52;
            headX = 0.44;
            headY = Math.sin(t * 2.2) * 0.58;
            legY = [0.30, 0.30, 0.20, 0.20];
            legRotX = [0.06, 0.06, -1.05, -1.05];
            tailBaseX = 0.65;
            tailBaseY = Math.sin(t * 5.0) * 0.28;
          }
        } else if (c.boltingTimer > 0) {
          // Dropped onto a sheep -> instant catapult spring-jump + frantic sprint dash away!
          c.boltingTimer = Math.max(0, c.boltingTimer - dt);
          c.boltElapsed += dt;
          earFlatten = 0.55;

          if (c.boltElapsed < 0.42) {
            const p = c.boltElapsed / 0.42;
            const arc = Math.sin(p * Math.PI);
            stepForwardSafely(c, 5.2, dt, 0.85, true);
            bodyY = arc * 1.22;
            torsoPitch = -0.28 + p * 0.45;
            torsoSZ = 1.20;
            torsoSY = 0.90;
            headX = -0.22;
            legRotX = [-0.95, -0.95, 0.95, 0.95];
            tailBaseX = 1.25;
          } else {
            stepForwardSafely(c, 4.1, dt, 0.85, true);
            const gp = t * 18.5;
            const frontSwing = Math.sin(gp) * 0.85;
            const backSwing = Math.sin(gp + 2.4) * 0.85;
            legRotX = [frontSwing, frontSwing * 0.9, backSwing, backSwing * 0.9];
            bodyY = Math.abs(Math.sin(gp)) * 0.14;
            torsoPitch = Math.cos(gp) * 0.18;
            torsoSZ = 1.15;
            headX = -0.12;
            tailBaseX = 0.45;
            tailBaseY = Math.sin(gp) * 0.28;
            c.scratchFxTimer -= dt;
            if (c.scratchFxTimer <= 0) {
              spawnGrassNibbles(c);
              c.scratchFxTimer = 0.18;
            }
          }

          if (c.boltingTimer <= 0) {
            c.state = 'Sit';
            c.stateTimer = 5.0;
            if (selectedSheep === c) syncToolbarActiveButton();
          }
        } else if (c.startleTimer > 0) {
          // Adorable quick startle recoil when a river fish leaps right in front of the cat!
          c.startleTimer = Math.max(0, c.startleTimer - dt);
          const sp = Math.sin((c.startleTimer / 0.72) * Math.PI);
          bodyY = sp * 0.42;
          torsoPitch = -0.32 * sp;
          torsoSY = 1 + 0.14 * sp;
          earFlatten = 0.55 * sp;
          tailBaseX = 1.25;
        } else if (c.purrTimer > 0) {
          // Blissful purring while being petted by the user's cursor!
          c.purrTimer = Math.max(0, c.purrTimer - dt);
          showPurr = true;
          eyesClosed = true;
          if (c.petEnergy > 1.7) {
            // Extra petting -> happily flops onto back for belly rubs!
            c.state = 'Belly';
            c.stateTimer = 7.0;
            const wiggle = Math.sin(t * 2.5);
            bodyY = 0.44;
            bodyRoll = Math.PI + wiggle * 0.20;
            torsoY = 0.20;
            headX = -0.14;
            legY = [0.12, 0.12, 0.12, 0.12];
            legRotX = [-0.55, -0.55, 0.42, 0.42];
            legRotZ = [-0.36, 0.36, -0.40, 0.40];
          } else {
            torsoY = 0.34;
            torsoPitch = -0.48;
            headX = 0.38 + Math.sin(t * 5.0) * 0.08;
            headZ = Math.sin(t * 4.0) * 0.16;
            legY = [0.30, 0.30, 0.20, 0.20];
            legRotX = [0.06, 0.06, -1.05, -1.05];
            tailBaseX = 0.95;
            tailBaseY = Math.sin(t * 4.5) * 0.30;
          }
        } else if (c.onRoofTimer > 0) {
          // Lounging lazily on top of the sunny red cottage roof!
          c.onRoofTimer = Math.max(0, c.onRoofTimer - dt);
          c.targetRotY = 0.1;
          eyesClosed = true;
          showZzz = true;
          torsoY = 0.22;
          torsoSX = 1.18;
          torsoSY = 0.80;
          headX = 0.24;
          legY = [0.18, 0.18, 0.18, 0.18];
          legRotX = [1.1, 1.1, -1.1, -1.1];
          tailBaseX = -0.15;
          tailBaseY = -0.95 + Math.sin(t * 2.2) * 0.18;
          if (c.onRoofTimer <= 0) {
            // Hop gracefully back down to the grass outside the pen
            c.root.position.set(PEN_X, getGroundY(PEN_X, PEN_Z + PEN_D * 0.5 + 1.2), PEN_Z + PEN_D * 0.5 + 1.2);
            c.dropSquash = 1.0;
            c.state = 'Walk';
            c.stateTimer = 6.0;
          }
        } else if (c.butterflyHunt) {
          // Classic cat butt-wiggle -> pounce at butterfly -> play it cool by washing face!
          const bh = c.butterflyHunt;
          bh.t += dt;
          const bf = bh.target;
          if (bh.phase === 'wiggle') {
            c.targetRotY = Math.atan2(bf.group.position.x - c.root.position.x, bf.group.position.z - c.root.position.z);
            torsoY = 0.24;
            torsoPitch = 0.24;
            bodyRoll = Math.sin(t * 24) * 0.16; // iconic pre-pounce butt wiggle!
            headX = -0.12;
            legRotX = [-0.45, -0.45, 0.35, 0.35];
            tailBaseX = 0.35;
            tailTipY = Math.sin(t * 18) * 0.55;
            if (bh.t >= 1.15) {
              bh.phase = 'pounce';
              bh.t = 0;
              bf.scareBoost = 1.0;
            }
          } else {
            const p = Math.min(1, bh.t / 0.55);
            const arc = Math.sin(p * Math.PI);
            stepForwardSafely(c, 3.2, dt, 0.85, true);
            bodyY = arc * 0.96;
            torsoPitch = -0.25 + p * 0.45;
            torsoSZ = 1.18;
            legRotX = [-1.05 * arc, -1.05 * arc, 0.85 * arc, 0.85 * arc];
            if (p >= 1) {
              c.butterflyHunt = null;
              c.dropSquash = 0.85;
              // Play it cool after missing: sit down & casually wash face!
              c.state = 'Wash';
              c.stateTimer = 4.5;
              if (selectedSheep === c) syncToolbarActiveButton();
            }
          }
        } else if (c.angerTimer > 0) {
          c.angerTimer = Math.max(0, c.angerTimer - dt);
          showAngry = true;
          if (c.angerTarget && !c.angerTarget.deleting) {
            c.targetRotY = Math.atan2(
              c.angerTarget.root.position.x - c.root.position.x,
              c.angerTarget.root.position.z - c.root.position.z
            );
          }
          torsoY = 0.42;
          torsoPitch = -0.14;
          torsoSY = 1.14;
          torsoSZ = 0.90;
          headX = -0.18;
          headY = Math.sin(t * 20) * 0.08;
          earFlatten = 0.65;
          tailBaseX = 1.15;
          tailBaseY = Math.sin(t * 18) * 0.65;
          tailTipY = Math.cos(t * 18) * 0.55;
          bodyY = Math.abs(Math.sin(t * 14)) * 0.03;
          if (c.angerTimer <= 0) {
            c.state = 'Sit';
            c.stateTimer = 4.5;
            if (selectedSheep === c) syncToolbarActiveButton();
          }
        } else if (c.reefAction) {
          const ra = c.reefAction;
          if (ra.phase === 'jump_to_reef' || ra.phase === 'jump_to_bank') {
            ra.t += dt / ra.duration;
            const p = Math.min(1, ra.t);
            const arc = Math.sin(p * Math.PI);

            c.targetRotY = Math.atan2(ra.endX - ra.startX, ra.endZ - ra.startZ);
            c.root.position.x = ra.startX + (ra.endX - ra.startX) * p;
            c.root.position.z = ra.startZ + (ra.endZ - ra.startZ) * p;
            c.root.position.y = ra.startY + (ra.endY - ra.startY) * p;

            // Graceful feline leap arc over the water
            bodyY = arc * 1.05;
            torsoPitch = -0.26 + p * 0.52;
            torsoSZ = 1.18;
            torsoSY = 0.92;
            headX = -0.15 + p * 0.30;
            legRotX = [-0.88 * arc, -0.88 * arc, 0.85 * arc, 0.85 * arc];
            tailBaseX = 0.75;
            tailTipX = -0.25;

            if (p >= 1) {
              c.dropSquash = 0.85;
              if (ra.phase === 'jump_to_reef') {
                ra.phase = 'perched';
                // Ensure a fish is swimming nearby when sitting on the reef to watch fish!
                if (ra.mode === 'sit' && fishList.length < MAX_RIVER_FISH && !fishList.some(f => Math.abs(f.z - REEF_Z) < 4.0)) {
                  const sp = spawnRiverFish(false);
                  sp.z = REEF_Z - sp.dir * 2.2;
                  sp.depth = 0.9;
                  sp.targetDepth = 1.0;
                }
              } else {
                // Landed cleanly on the target riverbank!
                c.reefAction = null;
                c.reefCooldown = 12.0;
                c.state = ra.mode === 'cross' ? 'Walk' : 'Sit';
                c.stateTimer = 5.5 + Math.random() * 3.0;
                if (selectedSheep === c) syncToolbarActiveButton();
              }
            }
          } else {
            // Perched on top of the brown river reef rock!
            c.root.position.x = REEF_X;
            c.root.position.z = REEF_Z;
            c.root.position.y = REEF_TOP_Y;
            ra.perchTimer -= dt;

            if (ra.mode === 'sit') {
              // Seated upright on the reef watching fish swim around the rock!
              let nearFish = null;
              let nearD = 5.2;
              for (let i = 0; i < fishList.length; i++) {
                const f = fishList[i];
                if (f.mat.opacity < 0.2) continue;
                const d = Math.hypot(f.group.position.x - REEF_X, f.group.position.z - REEF_Z);
                if (d < nearD) {
                  nearD = d;
                  nearFish = f;
                }
              }
              if (nearFish) {
                showFishCrave = true;
                const angToFish = Math.atan2(nearFish.group.position.x - REEF_X, nearFish.group.position.z - REEF_Z);
                const relAngle = shortestAngleDiff(c.root.rotation.y, angToFish);
                // Keep body naturally planted; smoothly turn head & tilt curiously to follow the fish!
                headY = Math.max(-0.98, Math.min(0.98, relAngle));
                headZ = -headY * 0.18;
                headX = 0.60 + Math.sin(t * 3.8) * 0.04;
                // Only gently re-seat body partway if the fish swims far behind the cat's shoulder
                if (Math.abs(relAngle) > 1.25) {
                  c.targetRotY = c.root.rotation.y + Math.sign(relAngle) * 0.55;
                }
              } else {
                headX = 0.52;
                headY = Math.sin(t * 1.4) * 0.42;
              }
              torsoY = 0.32;
              torsoPitch = -0.56;
              torsoSY = 0.96;
              legY = [0.30, 0.30, 0.20, 0.20];
              legRotX = [0.06, 0.06, -1.05, -1.05];
              tailBaseX = -0.22;
              tailBaseY = 0.85;
              tailTipY = 0.55 + Math.sin(t * (nearFish ? 8.5 : 3.2)) * 0.32;
            } else {
              // Brief nimble stepping-stone crouch on the rock, aiming at the opposite bank!
              const landZ = REEF_Z + (Math.random() - 0.5) * 0.4;
              const landX = getRiverCenterX(landZ) + ra.targetBankSide * (getRiverHalfWidth(landZ) + RIVER_MARGIN + 0.82);
              c.targetRotY = Math.atan2(landX - REEF_X, landZ - REEF_Z);
              torsoY = 0.28;
              torsoPitch = 0.16;
              headX = -0.10;
              legRotX = [-0.22, -0.22, 0.25, 0.25];
              tailBaseX = 0.65;
            }

            if (ra.perchTimer <= 0) {
              // Leap gracefully off the reef to the target bank!
              const landZ = Math.max(-SLAB_MARGIN_Z + 1, Math.min(SLAB_MARGIN_Z - 1, REEF_Z + (Math.random() - 0.5) * 1.2));
              const landX = getRiverCenterX(landZ) + ra.targetBankSide * (getRiverHalfWidth(landZ) + RIVER_MARGIN + 0.82);
              ra.phase = 'jump_to_bank';
              ra.t = 0;
              ra.duration = 0.62;
              ra.startX = REEF_X;
              ra.startY = REEF_TOP_Y;
              ra.startZ = REEF_Z;
              ra.endX = landX;
              ra.endY = getTerrainHeight(landX, landZ);
              ra.endZ = landZ;
            }
          }
        } else if (c.watchFish) {
          // Excitedly staring at the swimming fish, stalking along the riverbank & craving a snack!
          const f = c.watchFish;
          const stillAlive = fishList.includes(f) && f.mat.opacity > 0.12;
          c.watchTimer -= dt;
          if (!stillAlive || c.watchTimer <= 0) {
            c.watchFish = null;
            c.watchCooldown = 3.5;
            c.state = 'Sit';
            c.stateTimer = 4.5;
          } else {
            showFishCrave = true;
            const fx = f.group.position.x;
            const fz = f.group.position.z;
            const angleToFish = Math.atan2(fx - c.root.position.x, fz - c.root.position.z);

            // Follow the fish along whichever riverbank the cat is on (staying safely on grass!)
            const bankSide = c.root.position.x >= getRiverCenterX(c.root.position.z) ? 1 : -1;
            const desiredZ = Math.max(-SLAB_MARGIN_Z + 0.5, Math.min(SLAB_MARGIN_Z - 0.5, fz));
            const desiredX = getRiverCenterX(desiredZ) + bankSide * (getRiverHalfWidth(desiredZ) + RIVER_MARGIN + 0.36);
            const moveDx = desiredX - c.root.position.x;
            const moveDz = desiredZ - c.root.position.z;
            const moveDist = Math.hypot(moveDx, moveDz);

            let lookYawOffset = 0;
            if (moveDist > 0.38) {
              // Body walks forward along the riverbank while head turns sideways to watch the fish!
              c.targetRotY = Math.atan2(moveDx, moveDz);
              lookYawOffset = Math.max(-0.95, Math.min(0.95, shortestAngleDiff(c.root.rotation.y, angleToFish)));

              const stalkSpeed = Math.min(1.45, moveDist * 1.4);
              const nx = c.root.position.x + (moveDx / moveDist) * stalkSpeed * dt;
              const nz = c.root.position.z + (moveDz / moveDist) * stalkSpeed * dt;
              if (!isPositionBlocked(nx, nz, 0)) {
                c.root.position.x = nx;
                c.root.position.z = nz;
              }
              const sp = t * 9.5;
              const sw = Math.sin(sp) * 0.48;
              legRotX = [sw, -sw, -sw, sw];
              bodyY = Math.abs(Math.sin(sp)) * 0.03;
            } else {
              // Stopped beside the fish -> whole body faces the river & paws eagerly toward the water!
              c.targetRotY = angleToFish;
              const dab = Math.sin(t * 7.2);
              legRotX = [0.05, -0.78 + dab * 0.38, 0.12, 0.12];
            }

            // Low hunting crouch + head angled toward the swimming fish + fast excited tail-tip twitch
            torsoY = 0.29;
            torsoPitch = 0.18;
            torsoSZ = 1.08;
            headX = 0.36 + Math.sin(t * 5.2) * 0.05;
            headY = lookYawOffset + Math.sin(t * 4.0) * 0.06;
            tailBaseX = 0.55;
            tailBaseY = Math.sin(t * 6.5) * 0.25;
            tailTipY = Math.sin(t * 14.5) * 0.55;
          }
        } else if (c.wakeStretchTimer > 0) {
          // Big satisfying post-nap cat stretch before scratching claws!
          c.wakeStretchTimer = Math.max(0, c.wakeStretchTimer - dt);
          const sp = Math.sin((1 - c.wakeStretchTimer / 2.4) * Math.PI);
          torsoY = 0.34;
          torsoPitch = 0.46 * sp;
          torsoSZ = 1.0 + 0.28 * sp;
          torsoSY = 1.0 - 0.10 * sp;
          headX = -0.22 * sp;
          headY = 0.0;
          legY = [0.22, 0.22, 0.34, 0.34];
          legRotX = [-1.18 * sp, -1.18 * sp, 0.22 * sp, 0.22 * sp];
          tailBaseX = 0.5 + 0.85 * sp;
          tailTipX = -0.25 * sp;
        } else if (c.state === 'Sleep') {
          // Always curl up facing toward the screen (rotY = 0) with cute floating 💤
          c.targetRotY = 0.0;
          showZzz = true;
          eyesClosed = true;
          const breath = Math.sin(t * 2.1);
          torsoY = 0.20;
          torsoSX = 1.24 + breath * 0.03;
          torsoSY = 0.78 + breath * 0.035;
          torsoSZ = 0.84;
          headX = 0.34;
          headY = 0.32;
          headZ = 0.22;
          tailBaseX = -0.12;
          tailBaseY = -1.15;
          tailTipX = 0.05;
          tailTipY = -0.95;
          legY = [0.16, 0.16, 0.16, 0.16];
          legRotX = [1.15, 1.15, -1.15, -1.15];
        } else if (c.state === 'Wash') {
          // Authentic sitting cat face-washing: right paw lifts to cheek/ear & wipes in rhythmic circles!
          const wipe = Math.sin(t * 7.2);
          const wipeCos = Math.cos(t * 7.2);
          eyesClosed = wipe > -0.15;
          torsoY = 0.32;
          torsoPitch = -0.52;
          torsoSY = 0.96;
          // Head tilts affectionately into the washing paw
          headX = 0.56 + wipe * 0.12;
          headY = -0.24 + wipeCos * 0.14;
          headZ = -0.24 + wipe * 0.10;
          // Left paw planted for balance; right paw raised high wiping cheek & ear!
          legY = [0.30, 0.44, 0.20, 0.20];
          legRotX = [0.06, -2.05 + wipe * 0.42, -1.05, -1.05];
          legRotZ = [0.0, 0.42 + wipeCos * 0.14, 0.0, 0.0];
          tailBaseX = -0.22;
          tailBaseY = 0.82;
          tailTipY = 0.52 + Math.sin(t * 2.6) * 0.18;
        } else if (c.state === 'Scratch') {
          torsoY = 0.34;
          torsoPitch = 0.34;
          torsoSZ = 1.12;
          headX = 0.14;
          headY = Math.sin(t * 6.5) * 0.10;
          const rakeL = Math.sin(t * 11.5);
          const rakeR = Math.sin(t * 11.5 + Math.PI);
          legY = [0.22, 0.22, 0.33, 0.33];
          legRotX = [-0.72 + rakeL * 0.45, -0.72 + rakeR * 0.45, 0.15, 0.15];
          tailBaseX = 1.10;
          tailBaseY = Math.sin(t * 5.2) * 0.30;
          tailTipX = 0.35;
          tailTipY = Math.cos(t * 5.2) * 0.25;

          c.scratchFxTimer -= dt;
          if (c.scratchFxTimer <= 0) {
            spawnGrassNibbles(c);
            c.scratchFxTimer = 0.36 + Math.random() * 0.22;
          }
        } else if (c.state === 'Belly') {
          const wiggle = Math.sin(t * 1.9);
          // Flip bodyRig upside-down while lifting origin so the back rests on the grass and all 4 paws point cleanly up!
          bodyY = 0.44;
          bodyRoll = Math.PI + wiggle * 0.16;
          torsoY = 0.20;
          torsoSX = 1.06;
          torsoSY = 0.88;
          headX = -0.16;
          headY = 0.26 + Math.sin(t * 1.3) * 0.14;
          headZ = -0.18;
          legY = [0.12, 0.12, 0.12, 0.12];
          legRotX = [-0.52 + Math.sin(t * 4.0) * 0.18, -0.52 - Math.sin(t * 4.0) * 0.18, 0.42 + Math.sin(t * 3.2) * 0.12, 0.42 - Math.sin(t * 3.2) * 0.12];
          legRotZ = [-0.36, 0.36, -0.40, 0.40];
          tailBaseX = 0.18;
          tailBaseY = Math.sin(t * 2.6) * 0.52;
          tailTipY = Math.cos(t * 2.6) * 0.42;
        } else if (c.state === 'Walk') {
          stepForwardSafely(c, 1.05, dt, 0.78, true);
          if (!herdingEvent && herdingCooldown <= 0) {
            for (let i = 0; i < sheepList.length; i++) {
              const sh = sheepList[i];
              if (sh.deleting || sh.grabbed || sh.herded) continue;
              const d = Math.hypot(sh.root.position.x - c.root.position.x, sh.root.position.z - c.root.position.z);
              if (d < 1.85) {
                herdingCooldown = 8.0;
                if (Math.random() < 0.25 && startHerdingEvent(sh)) break;
              }
            }
          }
          c.walkTurnTimer -= dt;
          if (c.walkTurnTimer <= 0 && c.avoidCooldown <= 0) {
            c.targetRotY += (Math.random() - 0.5) * 1.15;
            c.walkTurnTimer = 2.4 + Math.random() * 2.8;
          }
          const wp = t * 7.8;
          const sw = Math.sin(wp) * 0.52;
          legRotX = [sw, -sw, -sw, sw];
          bodyY = Math.abs(Math.sin(wp)) * 0.04;
          torsoPitch = 0.04;
          headX = -0.05;
          headY = Math.sin(t * 1.4) * 0.14;
          tailBaseX = 1.18;
          tailBaseY = Math.sin(t * 3.6) * 0.24;
          tailTipX = -0.45;
          tailTipY = Math.cos(t * 3.6) * 0.22;
        } else {
          torsoY = 0.32;
          torsoPitch = -0.56;
          torsoSY = 0.96;
          headX = 0.52;
          headY = Math.sin(t * 1.1) * 0.34;
          legY = [0.30, 0.30, 0.20, 0.20];
          legRotX = [0.06, 0.06, -1.05, -1.05];
          tailBaseX = -0.25;
          tailBaseY = 0.85;
          tailTipX = 0.12;
          tailTipY = 0.55 + Math.sin(t * 3.2) * 0.28;
        }

        if (c.dropSquash > 0) {
          const sq = Math.sin(c.dropSquash * Math.PI) * 0.16;
          torsoSY -= sq;
          torsoSX += sq * 0.7;
          bodyY -= sq * 0.16;
        }
        const catAir = Math.max(0, (c.root.position.y - baseGY) + c.bodyRig.position.y);
        const catAoF = Math.max(0.18, 1 - catAir * 0.42);
        c.catAO.position.y = 0.015 - Math.max(0, c.root.position.y - baseGY);
        c.catAO.scale.set(1.04 * catAoF, 1.24 * catAoF, 1);
        c.catAO.material.opacity = 0.66 * catAoF;

        const k = Math.min(1, dt * (c.grabbed || c.boltingTimer > 0 ? 15.0 : 8.5));
        c.bodyRig.position.y += (bodyY - c.bodyRig.position.y) * k;
        c.bodyRig.rotation.x += (bodyPitch - c.bodyRig.rotation.x) * k;
        c.bodyRig.rotation.z += (bodyRoll - c.bodyRig.rotation.z) * k;
        c.torsoPivot.position.y += (torsoY - c.torsoPivot.position.y) * k;
        c.torsoPivot.rotation.x += (torsoPitch - c.torsoPivot.rotation.x) * k;
        c.torsoPivot.scale.x += (torsoSX - c.torsoPivot.scale.x) * k;
        c.torsoPivot.scale.y += (torsoSY - c.torsoPivot.scale.y) * k;
        c.torsoPivot.scale.z += (torsoSZ - c.torsoPivot.scale.z) * k;

        c.headPivot.rotation.x += (headX - c.headPivot.rotation.x) * k;
        c.headPivot.rotation.y += (headY - c.headPivot.rotation.y) * k;
        c.headPivot.rotation.z += (headZ - c.headPivot.rotation.z) * k;

        c.earPivots[0].rotation.z += ((-0.26 - earFlatten) - c.earPivots[0].rotation.z) * k;
        c.earPivots[1].rotation.z += ((0.26 + earFlatten) - c.earPivots[1].rotation.z) * k;

        c.openEyes.forEach(e => { e.visible = !eyesClosed; });
        c.closedLids.forEach(l => { l.visible = eyesClosed; });

        for (let i = 0; i < 4; i++) {
          c.legs[i].position.y += (legY[i] - c.legs[i].position.y) * k;
          c.legs[i].rotation.x += (legRotX[i] - c.legs[i].rotation.x) * k;
          c.legs[i].rotation.z += (legRotZ[i] - c.legs[i].rotation.z) * k;
        }

        c.tailBase.rotation.x += (tailBaseX - c.tailBase.rotation.x) * k;
        c.tailBase.rotation.y += (tailBaseY - c.tailBase.rotation.y) * k;
        c.tailTipPivot.rotation.x += (tailTipX - c.tailTipPivot.rotation.x) * k;
        c.tailTipPivot.rotation.y += (tailTipY - c.tailTipPivot.rotation.y) * k;

        c.zzzPop = showZzz ? Math.min(1, c.zzzPop + dt * 4.5) : Math.max(0, c.zzzPop - dt * 6.0);
        if (c.zzzPop > 0.01) {
          c.zzzSprite.visible = true;
          const sz = 0.84 * c.zzzPop * (1 + Math.sin(t * 2.6) * 0.08);
          c.zzzSprite.scale.set(sz, sz, 1);
          c.zzzSprite.position.set(0.18, 1.24 + Math.sin(t * 2.4) * 0.08, 0.14);
          c.zzzSprite.material.opacity = Math.min(1, c.zzzPop * 1.2);
          c.zzzSprite.material.rotation = Math.sin(t * 2.0) * 0.08;
        } else {
          c.zzzSprite.visible = false;
        }

        c.angryPop = showAngry ? Math.min(1, c.angryPop + dt * 6.5) : Math.max(0, c.angryPop - dt * 6.5);
        if (c.angryPop > 0.01) {
          c.angrySprite.visible = true;
          const sz = 0.72 * c.angryPop * (1 + Math.sin(t * 14) * 0.11);
          c.angrySprite.scale.set(sz, sz, 1);
          c.angrySprite.position.set(0.22, 1.38 + Math.sin(t * 12) * 0.04, 0.25);
          c.angrySprite.material.opacity = Math.min(1, c.angryPop * 1.25);
          c.angrySprite.material.rotation = Math.sin(t * 20) * 0.14;
        } else {
          c.angrySprite.visible = false;
        }

        // Animate cute 'craving fish' thought bubble above cat's head
        c.fishCravePop = showFishCrave ? Math.min(1, c.fishCravePop + dt * 5.5) : Math.max(0, c.fishCravePop - dt * 6.0);
        if (c.fishCravePop > 0.01) {
          c.fishCraveSprite.visible = true;
          const pulse = 1 + Math.sin(t * 5.5) * 0.07;
          const sz = 1.08 * c.fishCravePop * pulse;
          c.fishCraveSprite.scale.set(sz, sz, 1);
          c.fishCraveSprite.position.set(0.18, 1.50 + Math.sin(t * 4.2) * 0.06, 0.26);
          c.fishCraveSprite.material.opacity = Math.min(1, c.fishCravePop * 1.2);
          c.fishCraveSprite.material.rotation = Math.sin(t * 3.8) * 0.07;
        } else {
          c.fishCraveSprite.visible = false;
        }

        // Animate cute guard shield badge ('🛡️') above cat while guarding the sheep pen
        c.shieldPop = showShield ? Math.min(1, c.shieldPop + dt * 5.8) : Math.max(0, c.shieldPop - dt * 6.5);
        if (c.shieldPop > 0.01) {
          c.shieldSprite.visible = true;
          const pulse = 1 + Math.sin(t * 4.5) * 0.06;
          const sz = 0.84 * c.shieldPop * pulse;
          c.shieldSprite.scale.set(sz, sz, 1);
          c.shieldSprite.position.set(0.0, 1.48 + Math.sin(t * 3.4) * 0.06, 0.16);
          c.shieldSprite.material.opacity = Math.min(1, c.shieldPop * 1.2);
          c.shieldSprite.material.rotation = Math.sin(t * 2.8) * 0.07;
        } else {
          c.shieldSprite.visible = false;
        }

        c.purrPop = showPurr ? Math.min(1, c.purrPop + dt * 5.5) : Math.max(0, c.purrPop - dt * 6.0);
        if (c.purrPop > 0.01) {
          c.purrSprite.visible = true;
          const sz = 0.78 * c.purrPop * (1 + Math.sin(t * 6.5) * 0.10);
          c.purrSprite.scale.set(sz, sz, 1);
          c.purrSprite.position.set(0.24, 1.46 + Math.sin(t * 4.6) * 0.09, 0.20);
          c.purrSprite.material.opacity = Math.min(1, c.purrPop * 1.2);
          c.purrSprite.material.rotation = Math.sin(t * 5.0) * 0.16;
        } else {
          c.purrSprite.visible = false;
        }
      }

      // ------------------------------------------------------------------
      // 7. Sheep Animation State Machine (Idle / Graze / Walk / Jump)
      // ------------------------------------------------------------------
      function shortestAngleDiff(current, target) {
        let diff = (target - current + Math.PI) % (Math.PI * 2) - Math.PI;
        if (diff < -Math.PI) diff += Math.PI * 2;
        return diff;
      }

      const SLAB_MIN_X = TERRAIN_MIN_X + 1.25;
      const SLAB_MAX_X = TERRAIN_MAX_X - 1.25;
      const SLAB_MARGIN_Z = SLAB_D / 2 - 1.25;
      const RIVER_MARGIN = 0.58;

      function isPositionBlocked(x, z, extraRiverPad) {
        if (x < SLAB_MIN_X || x > SLAB_MAX_X || Math.abs(z) > SLAB_MARGIN_Z) {
          return true;
        }
        if (isInsideHouseFootprint(x, z, 0.28) || isInsidePen(x, z, 0.32)) {
          return true;
        }
        // Bridge deck is always walkable across the river
        if (isOnBridge(x, z, 0)) {
          return false;
        }
        const pad = RIVER_MARGIN + (extraRiverPad || 0);
        return isInRiver(x, z, pad);
      }

      function findClearHeading(x, z, preferredAng) {
        // Test 12 radial rays at 0.9u and 1.8u ahead to guarantee picking a genuinely open path out of corners!
        let bestAng = preferredAng;
        let bestScore = -1e9;
        for (let k = 0; k < 12; k++) {
          const ang = (k / 12) * Math.PI * 2;
          const dx = Math.sin(ang);
          const dz = Math.cos(ang);
          const clear1 = !isPositionBlocked(x + dx * 0.85, z + dz * 0.85, 0.04);
          const clear2 = !isPositionBlocked(x + dx * 1.75, z + dz * 1.75, 0.04);
          const clear3 = !isPositionBlocked(x + dx * 2.60, z + dz * 2.60, 0.04);
          if (!clear1) continue;
          const align = Math.cos(shortestAngleDiff(ang, preferredAng));
          const score = (clear2 ? 2.2 : 0) + (clear3 ? 1.2 : 0) + align * 1.15 + Math.random() * 0.25;
          if (score > bestScore) {
            bestScore = score;
            bestAng = ang;
          }
        }
        return bestAng;
      }

      function computeSafeEscapeAngle(x, z, currentRotY) {
        // If on the bridge, steer cleanly along the bridge axis (±X) so sheep walk straight across
        if (isOnBridge(x, z, 0.25)) {
          const headingX = Math.sin(currentRotY || 0);
          const dirX = headingX >= 0 ? 1 : -1;
          const centerPullZ = (BRIDGE_Z - z) * 0.7;
          return Math.atan2(dirX, centerPullZ);
        }

        let vx = 0;
        let vz = 0;
        const riverCx = getRiverCenterX(z);
        const riverSafeDist = getRiverHalfWidth(z) + RIVER_MARGIN + 0.75;
        const dxRiver = x - riverCx;
        if (Math.abs(dxRiver) < riverSafeDist) {
          if (Math.abs(z - BRIDGE_Z) < 3.6 && Math.random() < 0.45) {
            const entryX = BRIDGE_X + (dxRiver >= 0 ? 1 : -1) * (BRIDGE_SPAN * 0.5 + 0.35);
            return Math.atan2(entryX - x, BRIDGE_Z - z);
          }
          vx += (dxRiver >= 0 ? 1 : -1) * 2.4;
        }
        if (x > SLAB_MAX_X - 1.35) vx -= 2.4;
        if (x < SLAB_MIN_X + 1.35) vx += 2.4;
        if (z > SLAB_MARGIN_Z - 1.35) vz -= 2.4;
        if (z < -SLAB_MARGIN_Z + 1.35) vz += 2.4;
        if (isInsidePen(x, z, 1.5)) {
          vx += (x - PEN_X) * 2.2 - 0.8;
          vz += (z - PEN_Z) * 2.2 + 1.6;
        }

        if (vx === 0 && vz === 0) {
          const bankTargetX = x < riverCx ? -12.8 : 2.5;
          vx = bankTargetX - x;
          vz = -z * 0.6;
        }
        const preferred = Math.atan2(vx, vz);
        return findClearHeading(x, z, preferred);
      }

      function stepForwardSafely(s, speed, dt, lookAheadDist, leapOverSheep) {
        const x = s.root.position.x;
        const z = s.root.position.z;

        // If somehow already inside a blocked zone (e.g., curved riverbank), gently nudge out immediately
        if (isPositionBlocked(x, z, 0)) {
          const riverCx = getRiverCenterX(z);
          const riverEdge = getRiverHalfWidth(z) + RIVER_MARGIN + 0.08;
          if (Math.abs(x - riverCx) < riverEdge) {
            const side = x >= riverCx ? 1 : -1;
            const pushedX = riverCx + side * riverEdge;
            if (pushedX >= SLAB_MIN_X && pushedX <= SLAB_MAX_X) {
              s.root.position.x = pushedX;
            }
          }
          if (isInsidePen(s.root.position.x, s.root.position.z, 0.38)) {
            const px = s.root.position.x - PEN_X;
            const pz = s.root.position.z - PEN_Z;
            const pd = Math.hypot(px, pz) || 1;
            s.root.position.x += (px / pd) * 0.25;
            s.root.position.z += (pz / pd) * 0.25;
          }
          s.root.position.x = Math.max(SLAB_MIN_X + 0.05, Math.min(SLAB_MAX_X - 0.05, s.root.position.x));
          s.root.position.z = Math.max(-SLAB_MARGIN_Z + 0.05, Math.min(SLAB_MARGIN_Z - 0.05, s.root.position.z));
          if (s.avoidCooldown <= 0) {
            s.targetRotY = computeSafeEscapeAngle(s.root.position.x, s.root.position.z, s.root.rotation.y);
            s.avoidCooldown = 0.55;
          }
          return false;
        }

        const dirX = Math.sin(s.root.rotation.y);
        const dirZ = Math.cos(s.root.rotation.y);
        const stepX = x + dirX * speed * dt;
        const stepZ = z + dirZ * speed * dt;
        const probeX = x + dirX * lookAheadDist;
        const probeZ = z + dirZ * lookAheadDist;

        if (isPositionBlocked(probeX, probeZ, 0.05) || isPositionBlocked(stepX, stepZ, 0)) {
          if (s.avoidCooldown <= 0) {
            s.targetRotY = computeSafeEscapeAngle(x, z, s.root.rotation.y);
            s.avoidCooldown = 0.55;
          }
          // Only move forward if the immediate step itself is still clear
          if (!isPositionBlocked(stepX, stepZ, 0)) {
            s.root.position.x = stepX;
            s.root.position.z = stepZ;
            return true;
          }
          return false;
        }

        // When not already airborne/leaping, either vault cleanly over a blocking sheep or steer around
        if (!leapOverSheep) {
          for (let j = 0; j < sheepList.length; j++) {
            const other = sheepList[j];
            if (other === s || other.deleting || other.grabbed) continue;
            const odx = other.root.position.x - x;
            const odz = other.root.position.z - z;
            const odist = Math.hypot(odx, odz);
            const avoidRadius = (other.state === 'Idle' || other.angerTimer > 0) ? 1.38 : 1.24;
            if (odist > 0.001 && odist < avoidRadius) {
              const forwardDot = (odx * dirX + odz * dirZ) / odist;
              if (forwardDot > 0.42) {
                // Roll once per encounter: ~28% chance (55% for Jump sheep) to vault over, otherwise bump/sidestep
                let didVault = false;
                if (s.vaultCooldown <= 0) {
                  const landX = x + dirX * 2.15;
                  const landZ = z + dirZ * 2.15;
                  const canLandSafely = !isPositionBlocked(landX, landZ, 0.06);
                  const vaultChance = s.state === 'Jump' ? 0.55 : 0.28;
                  s.vaultCooldown = 2.8 + Math.random() * 2.4;
                  if (canLandSafely && Math.random() < vaultChance) {
                    s.vaultTime = 0.001;
                    didVault = true;
                  }
                }

                if (didVault) {
                  break;
                } else if (s.avoidCooldown <= 0) {
                  const cross = dirX * odz - dirZ * odx;
                  const turnDir = cross >= 0 ? -1 : 1;
                  s.targetRotY = s.root.rotation.y + turnDir * (0.75 + Math.random() * 0.45);
                  s.avoidCooldown = 0.38;
                  if (odist < 1.02) return false;
                  break;
                }
              }
            }
          }
        }

        // Sheep politely give the Golden Shaded cat space most of the time, only occasionally disturbing its nap
        if (!s.isCat && goldenCat && !leapOverSheep) {
          const cdx = goldenCat.root.position.x - x;
          const cdz = goldenCat.root.position.z - z;
          const cdist = Math.hypot(cdx, cdz);
          if (cdist > 0.001 && cdist < 1.95) {
            const cDot = (cdx * dirX + cdz * dirZ) / cdist;
            if (cDot > 0.25 && s.avoidCooldown <= 0) {
              if (!herdingEvent && herdingCooldown <= 0 && goldenCat.state !== 'Sleep' && goldenCat.angerTimer <= 0 && !goldenCat.reefAction && Math.random() < 0.18) {
                if (startHerdingEvent(s)) return false;
              }
              const shouldDisturb = goldenCat.state === 'Sleep' && goldenCat.disturbCooldown <= 0 && Math.random() < 0.16;
              if (!shouldDisturb) {
                const cross = dirX * cdz - dirZ * cdx;
                const turnDir = cross >= 0 ? -1 : 1;
                s.targetRotY = s.root.rotation.y + turnDir * (0.95 + Math.random() * 0.45);
                s.avoidCooldown = 0.65;
                if (cdist < 1.32) return false;
              } else {
                s.avoidCooldown = 1.2;
              }
            }
          }
        }

        s.root.position.x = stepX;
        s.root.position.z = stepZ;
        return true;
      }

      // Pairwise sheep-to-sheep soft separation solver to eliminate clipping without pushing into the river
      const SHEEP_MIN_DIST = 1.08;
      function resolveSheepCollisions(dt) {
        const count = sheepList.length;
        if (count < 2) return;
        const stiffness = Math.min(1, dt * 13);

        for (let i = 0; i < count; i++) {
          const a = sheepList[i];
          if (a.deleting || a.grabbed || a.herded) continue;
          for (let j = i + 1; j < count; j++) {
            const b = sheepList[j];
            if (b.deleting || b.grabbed) continue;
            if (a.pairInteraction && a.pairInteraction === b.pairInteraction) continue;

            // Allow any leaping/vaulting sheep in the air to pass cleanly over another sheep
            const aAir = a.bodyRig.position.y;
            const bAir = b.bodyRig.position.y;
            if (aAir > 0.28 || bAir > 0.28 || Math.abs((a.root.position.y + aAir) - (b.root.position.y + bAir)) > 0.58) continue;

            const dx = b.root.position.x - a.root.position.x;
            const dz = b.root.position.z - a.root.position.z;
            const dist = Math.hypot(dx, dz);
            const onSameBridge = isOnBridge(a.root.position.x, a.root.position.z, 0.2) && isOnBridge(b.root.position.x, b.root.position.z, 0.2);
            const minDist = onSameBridge ? 0.92 : SHEEP_MIN_DIST;

            if (dist < minDist) {
              let nx, nz;
              if (dist < 0.001) {
                const ang = (a.id * 1.7 + b.id * 2.3) % (Math.PI * 2);
                nx = Math.cos(ang);
                nz = Math.sin(ang);
              } else {
                nx = dx / dist;
                nz = dz / dist;
              }
              const overlap = minDist - dist;
              const totalPush = overlap * stiffness * 1.05;

              const aAnchored = a.state === 'Idle' || a.angerTimer > 0;
              const bAnchored = b.state === 'Idle' || b.angerTimer > 0;

              let wA = 0.5;
              let wB = 0.5;
              if (aAnchored && !bAnchored) {
                wA = 0.0;
                wB = 1.0;
              } else if (!aAnchored && bAnchored) {
                wA = 1.0;
                wB = 0.0;
              }

              const axNew = a.root.position.x - nx * totalPush * wA;
              const azNew = a.root.position.z - nz * totalPush * wA;
              const bxNew = b.root.position.x + nx * totalPush * wB;
              const bzNew = b.root.position.z + nz * totalPush * wB;

              const aCanMove = wA > 0 && !isPositionBlocked(axNew, azNew, 0);
              const bCanMove = wB > 0 && !isPositionBlocked(bxNew, bzNew, 0);

              if (aCanMove) {
                a.root.position.x = axNew;
                a.root.position.z = azNew;
              }
              if (bCanMove) {
                b.root.position.x = bxNew;
                b.root.position.z = bzNew;
              }

              // Fallback only if the moving sheep is completely pinned against river/edge
              if (wA === 0 && !bCanMove) {
                const axFallback = a.root.position.x - nx * totalPush * 0.45;
                const azFallback = a.root.position.z - nz * totalPush * 0.45;
                if (!isPositionBlocked(axFallback, azFallback, 0)) {
                  a.root.position.x = axFallback;
                  a.root.position.z = azFallback;
                }
              } else if (wB === 0 && !aCanMove) {
                const bxFallback = b.root.position.x + nx * totalPush * 0.45;
                const bzFallback = b.root.position.z + nz * totalPush * 0.45;
                if (!isPositionBlocked(bxFallback, bzFallback, 0)) {
                  b.root.position.x = bxFallback;
                  b.root.position.z = bzFallback;
                }
              } else if (wA === 0.5 && aCanMove && !bCanMove) {
                const axExtra = a.root.position.x - nx * totalPush * 0.45;
                const azExtra = a.root.position.z - nz * totalPush * 0.45;
                if (!isPositionBlocked(axExtra, azExtra, 0)) {
                  a.root.position.x = axExtra;

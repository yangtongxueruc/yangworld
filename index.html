                  a.root.position.z = azExtra;
                }
              } else if (wB === 0.5 && bCanMove && !aCanMove) {
                const bxExtra = b.root.position.x + nx * totalPush * 0.45;
                const bzExtra = b.root.position.z + nz * totalPush * 0.45;
                if (!isPositionBlocked(bxExtra, bzExtra, 0)) {
                  b.root.position.x = bxExtra;
                  b.root.position.z = bzExtra;
                }
              }
            }
          }
        }

        // Prevent any sheep from clipping through the Golden Shaded cat
        if (goldenCat && !goldenCat.grabbed && goldenCat.bodyRig.position.y < 0.35) {
          const catMinDist = 1.18;
          const catStationary = goldenCat.state !== 'Walk' || goldenCat.angerTimer > 0;
          for (let i = 0; i < count; i++) {
            const sh = sheepList[i];
            if (sh.deleting || sh.grabbed || sh.herded) continue;
            // Allow high-jumping sheep to clear over the cat cleanly
            if (sh.bodyRig.position.y > 0.42) continue;

            const dx = sh.root.position.x - goldenCat.root.position.x;
            const dz = sh.root.position.z - goldenCat.root.position.z;
            const dist = Math.hypot(dx, dz);
            if (dist < catMinDist) {
              let nx, nz;
              if (dist < 0.001) {
                nx = 1;
                nz = 0;
              } else {
                nx = dx / dist;
                nz = dz / dist;
              }
              const overlap = catMinDist - dist;
              const push = overlap * Math.min(1, dt * 16) * 1.1;
              const wSh = catStationary ? 1.0 : 0.65;
              const wCat = catStationary ? 0.0 : 0.35;

              const shX = sh.root.position.x + nx * push * wSh;
              const shZ = sh.root.position.z + nz * push * wSh;
              if (!isPositionBlocked(shX, shZ, 0)) {
                sh.root.position.x = shX;
                sh.root.position.z = shZ;
              } else if (catStationary) {
                const cX = goldenCat.root.position.x - nx * push * 0.5;
                const cZ = goldenCat.root.position.z - nz * push * 0.5;
                if (!isPositionBlocked(cX, cZ, 0)) {
                  goldenCat.root.position.x = cX;
                  goldenCat.root.position.z = cZ;
                }
              }
              if (wCat > 0) {
                const cX = goldenCat.root.position.x - nx * push * wCat;
                const cZ = goldenCat.root.position.z - nz * push * wCat;
                if (!isPositionBlocked(cX, cZ, 0)) {
                  goldenCat.root.position.x = cX;
                  goldenCat.root.position.z = cZ;
                }
              }
            }
          }
        }
      }

      // Lightweight grass-nibble particles for vivid grazing feedback
      const grassBits = [];
      const grassBitGeo = new THREE.BoxGeometry(0.075, 0.12, 0.04);
      const grassBitMats = [
        new THREE.MeshStandardMaterial({ color: 0x6ea843, roughness: 0.9, transparent: true, opacity: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x8cc654, roughness: 0.9, transparent: true, opacity: 1 }),
        new THREE.MeshStandardMaterial({ color: 0x558b35, roughness: 0.9, transparent: true, opacity: 1 })
      ];

      function spawnGrassNibbles(sheep) {
        const dirX = Math.sin(sheep.root.rotation.y);
        const dirZ = Math.cos(sheep.root.rotation.y);
        const mouthX = sheep.root.position.x + dirX * 0.62;
        const mouthZ = sheep.root.position.z + dirZ * 0.62;
        for (let k = 0; k < 2; k++) {
          const mat = grassBitMats[(Math.random() * grassBitMats.length) | 0].clone();
          const mesh = new THREE.Mesh(grassBitGeo, mat);
          mesh.position.set(
            mouthX + (Math.random() - 0.5) * 0.18,
            0.12 + Math.random() * 0.08,
            mouthZ + (Math.random() - 0.5) * 0.18
          );
          mesh.rotation.set(Math.random() * 2, Math.random() * 2, Math.random() * 2);
          dioramaGroup.add(mesh);
          grassBits.push({
            mesh,
            vx: (Math.random() - 0.5) * 0.85,
            vy: 1.05 + Math.random() * 0.65,
            vz: (Math.random() - 0.5) * 0.85,
            life: 0,
            maxLife: 0.45 + Math.random() * 0.22
          });
        }
      }

      function updateGrassNibbles(dt) {
        for (let i = grassBits.length - 1; i >= 0; i--) {
          const b = grassBits[i];
          b.life += dt;
          if (b.life >= b.maxLife) {
            dioramaGroup.remove(b.mesh);
            b.mesh.material.dispose();
            grassBits.splice(i, 1);
            continue;
          }
          b.vy -= 3.6 * dt;
          b.mesh.position.x += b.vx * dt;
          b.mesh.position.y = Math.max(0.03, b.mesh.position.y + b.vy * dt);
          b.mesh.position.z += b.vz * dt;
          b.mesh.rotation.x += 5.0 * dt;
          b.mesh.rotation.z += 4.2 * dt;
          const p = b.life / b.maxLife;
          b.mesh.material.opacity = Math.max(0, 1 - p * p);
          b.mesh.scale.setScalar(1 - p * 0.45);
        }
      }

      function updateSheep(dt, elapsed) {
        updateGrassNibbles(dt);
        updatePairInteractions(dt);
        updateHerdingEvent(dt, elapsed);
        for (let i = sheepList.length - 1; i >= 0; i--) {
          const s = sheepList[i];

          // Pop-in / shrink-out scale animation
          if (s.deleting) {
            s.spawnScale = Math.max(0, s.spawnScale - dt * 5.2);
            s.root.scale.setScalar(s.spawnScale);
            if (s.spawnScale <= 0.01) {
              dioramaGroup.remove(s.root);
              if (selectedSheep === s) selectedSheep = null;
              if (hoveredSheep === s) hoveredSheep = null;
              sheepList.splice(i, 1);
            }
            continue;
          } else if (s.spawnScale < 1) {
            s.spawnScale = Math.min(1, s.spawnScale + dt * 4.5);
            const overshoot = 1 + Math.sin(s.spawnScale * Math.PI) * 0.12;
            s.root.scale.setScalar(s.spawnScale * overshoot);
            if (s.spawnScale >= 1) s.root.scale.setScalar(1);
          }

          if (s.avoidCooldown > 0) {
            s.avoidCooldown = Math.max(0, s.avoidCooldown - dt);
          }
          if (s.vaultCooldown > 0) {
            s.vaultCooldown = Math.max(0, s.vaultCooldown - dt);
          }
          if (s.steppedCooldown > 0) {
            s.steppedCooldown = Math.max(0, s.steppedCooldown - dt);
          }
          if (s.fleePenCooldown > 0) s.fleePenCooldown = Math.max(0, s.fleePenCooldown - dt);
          if (s.drinkCooldown > 0) s.drinkCooldown = Math.max(0, s.drinkCooldown - dt);
          if (s.shakeCooldown > 0) s.shakeCooldown = Math.max(0, s.shakeCooldown - dt);
          if (s.followCooldown > 0) s.followCooldown = Math.max(0, s.followCooldown - dt);

          // Countdown sweater duration -> trigger magical golden wool rebirth!
          if (s.hasSweater && !s.grabbed && !s.herded && s.rebirthTimer <= 0) {
            s.sweaterTimer -= dt;
            if (s.sweaterTimer <= 0) {
              s.rebirthTimer = 1.85;
              spawnGoldenRebirthFX(s);
            }
          }

          // Trigger gentle flock-following, riverbank drinking, or occasional wool shake-off
          if (!s.grabbed && !s.herded && s.angerTimer <= 0 && s.scaredTimer <= 0 && s.fleePenTimer <= 0 && !s.pairInteraction && s.vaultTime <= 0) {
            // Riverbank drinking
            const distWater = Math.abs(s.root.position.x - getRiverCenterX(s.root.position.z)) - getRiverHalfWidth(s.root.position.z);
            if (s.drinkTimer <= 0 && s.drinkCooldown <= 0 && distWater < 1.15 && !isOnBridge(s.root.position.x, s.root.position.z, 0.25)) {
              s.drinkCooldown = 12 + Math.random() * 12;
              if (Math.random() < 0.35) {
                s.drinkTimer = 2.6;
                s.drinkRippleT = 0.2;
              }
            }
            // Occasional adorable wool shake-off
            if (s.shakeTimer <= 0 && s.shakeCooldown <= 0 && (s.state === 'Idle' || s.state === 'Graze')) {
              s.shakeCooldown = 14 + Math.random() * 14;
              if (Math.random() < 0.22) {
                s.shakeTimer = 0.85;
                spawnGrassNibbles(s);
              }
            }
            // Flock leader-following instinct (follow a walking sheep nearby!)
            if (!s.followLeader && s.followCooldown <= 0 && (s.state === 'Idle' || s.state === 'Graze')) {
              for (let j = 0; j < sheepList.length; j++) {
                const cand = sheepList[j];
                if (cand === s || cand.deleting || cand.grabbed || cand.herded || cand.state !== 'Walk') continue;
                const d = Math.hypot(cand.root.position.x - s.root.position.x, cand.root.position.z - s.root.position.z);
                if (d > 1.3 && d < 3.6) {
                  s.followCooldown = 14 + Math.random() * 10;
                  if (Math.random() < 0.24) {
                    s.followLeader = cand;
                    s.followTimer = 4.5 + Math.random() * 3.0;
                  }
                  break;
                }
              }
            }
          }
          // Real-time anti-corner-stuck watchdog for any moving sheep
          const isActivelyMoving = !s.grabbed && !s.herded && !s.pairInteraction && s.angerTimer <= 0 && s.scaredTimer <= 0 && s.drinkTimer <= 0 && s.shakeTimer <= 0 && s.rebirthTimer <= 0 && (
            s.state === 'Walk' ||
            (s.state === 'Graze' && s.grazePhase === 'walk') ||
            (s.state === 'Jump' && s.jumpPhase === 'walk') ||
            s.fleePenTimer > 0 ||
            Boolean(s.followLeader)
          );
          if (isActivelyMoving) {
            s.stuckTimer += dt;
            if (s.stuckTimer >= 0.95) {
              const movedDist = Math.hypot(s.root.position.x - s.lastCheckX, s.root.position.z - s.lastCheckZ);
              if (movedDist < 0.22) {
                // Unstick immediately: drop follower lock, pick a guaranteed open heading, and gently nudge inward!
                s.followLeader = null;
                s.fleePenTimer = 0;
                const clearAng = computeSafeEscapeAngle(s.root.position.x, s.root.position.z, s.root.rotation.y);
                s.targetRotY = clearAng;
                s.root.rotation.y = clearAng;
                s.avoidCooldown = 0.65;
                const nx = s.root.position.x + Math.sin(clearAng) * 0.35;
                const nz = s.root.position.z + Math.cos(clearAng) * 0.35;
                if (!isPositionBlocked(nx, nz, 0)) {
                  s.root.position.x = nx;
                  s.root.position.z = nz;
                }
              }
              s.lastCheckX = s.root.position.x;
              s.lastCheckZ = s.root.position.z;
              s.stuckTimer = 0;
            }
          } else {
            s.stuckTimer = 0;
            s.lastCheckX = s.root.position.x;
            s.lastCheckZ = s.root.position.z;
          }

          // If a moving sheep wanders near the sheep pen, it gets spooked and quickly runs away!
          if (!s.grabbed && s.fleePenTimer <= 0 && s.fleePenCooldown <= 0 && s.scaredTimer <= 0 && !s.pairInteraction) {
            const isMoving = s.state === 'Walk' || s.state === 'Jump' || (s.state === 'Graze' && s.grazePhase === 'walk');
            if (isMoving && isInsidePen(s.root.position.x, s.root.position.z, 1.75)) {
              const awayX = s.root.position.x - PEN_X;
              const awayZ = s.root.position.z - PEN_Z;
              let runAng = Math.atan2(awayX - 0.6, awayZ + 0.9);
              if (isPositionBlocked(s.root.position.x + Math.sin(runAng) * 1.5, s.root.position.z + Math.cos(runAng) * 1.5, 0.05)) {
                runAng = computeSafeEscapeAngle(s.root.position.x, s.root.position.z, runAng);
              }
              s.targetRotY = runAng;
              s.fleePenTimer = 1.85;
              s.fleePenCooldown = 4.5;
              s.vaultTime = 0;
            }
          }

          // Smooth yaw rotation (slightly brisker when avoiding obstacles)
          const turnRate = s.avoidCooldown > 0 ? 10.5 : 6.5;
          s.root.rotation.y += shortestAngleDiff(s.root.rotation.y, s.targetRotY) * Math.min(1, dt * turnRate);

          // Smooth vertical elevation following (lifted high when grabbed, otherwise follows grass/bridge)
          const targetGroundY = s.grabbed
            ? getGroundY(s.root.position.x, s.root.position.z) + 1.55
            : getGroundY(s.root.position.x, s.root.position.z);
          s.root.position.y += (targetGroundY - s.root.position.y) * Math.min(1, dt * (s.grabbed ? 18 : 14));

          const t = elapsed + s.phase;
          let targetHeadX = 0.0;
          let targetHeadY = 0.0;
          let targetHeadZ = 0.0;
          let targetBodyY = 0.0;
          let targetBodyPitch = 0.0;
          let targetBodyRoll = 0.0;
          let targetScaleY = 1.0;
          let targetScaleXZ = 1.0;
          let legSwing = 0.0;
          let legSwingBack = null;
          let showQuestion = false;
          let showAngry = false;
          let showSweat = false;
          let showClap = false;

          if (s.dropSquash > 0) {
            s.dropSquash = Math.max(0, s.dropSquash - dt * 3.8);
          }

          if (s.grabbed) {
            // Frantic cute struggling while lifted by the mouse
            targetBodyRoll = Math.sin(t * 22) * 0.24;
            targetBodyPitch = Math.cos(t * 16) * 0.14;
            targetBodyY = Math.sin(t * 18) * 0.05;
            targetHeadX = -0.22 + Math.sin(t * 20) * 0.14;
            targetHeadY = Math.sin(t * 26) * 0.42;
            targetHeadZ = Math.cos(t * 22) * 0.20;
            targetScaleY = 1.07;
            targetScaleXZ = 0.95;
            legSwing = Math.sin(t * 30) * 0.85;
            legSwingBack = Math.cos(t * 32) * 0.82;
          } else if (s.angerTimer > 0) {
            // Glaring up at the camera with cute angry puff & indignant head tilt
            s.angerTimer = Math.max(0, s.angerTimer - dt);
            showAngry = true;
            const lookX = (s.angerLookTarget && !s.angerLookTarget.deleting)
              ? s.angerLookTarget.root.position.x
              : camera.position.x;
            const lookZ = (s.angerLookTarget && !s.angerLookTarget.deleting)
              ? s.angerLookTarget.root.position.z
              : camera.position.z;
            s.targetRotY = Math.atan2(
              lookX - s.root.position.x,
              lookZ - s.root.position.z
            );
            const stomp = Math.sin(t * 16);
            const huff = Math.sin(t * 10) * 0.04;
            targetHeadX = -0.46 + huff;
            targetHeadY = Math.sin(t * 24) * 0.06;
            targetHeadZ = 0.10;
            targetBodyPitch = -0.08;
            targetBodyRoll = Math.sin(t * 26) * 0.045;
            targetScaleXZ = 1.07 + huff;
            targetScaleY = 0.96 - huff * 0.5;
            legSwing = stomp > 0.7 ? 0.26 : 0;
            targetBodyY = stomp > 0.7 ? 0.04 : 0;
          } else if (s.exitingCottage) {
            const wp = t * 10.5;
            legSwing = Math.sin(wp) * 0.50;
            targetBodyY = Math.abs(Math.sin(wp)) * 0.055;
            targetHeadX = 0.08;
          } else if (s.herded && herdingEvent && herdingEvent.sheep === s) {
            const st = herdingEvent.stage;
            if (st === 'herd') {
              showSweat = true;
              const rp = t * 17.5;
              legSwing = Math.sin(rp) * 0.72;
              targetBodyY = Math.abs(Math.sin(rp)) * 0.09;
              targetBodyRoll = Math.sin(rp) * 0.08;
              targetHeadX = -0.10;
              targetHeadY = Math.sin(t * 14) * 0.25;
            } else if (st === 'shiver' || st === 'shear') {
              showSweat = st === 'shiver';
              targetBodyY = -0.06;
              targetBodyPitch = 0.14;
              targetBodyRoll = Math.sin(t * 44) * 0.12;
              targetScaleY = 0.88;
              targetScaleXZ = 1.07;
              targetHeadX = 0.36;
              targetHeadY = Math.sin(t * 28) * 0.22;
              legSwing = Math.sin(t * 26) * 0.18;
            } else if (st === 'confused') {
              targetHeadX = 0.56 + Math.sin(t * 3.5) * 0.12;
              targetHeadY = Math.sin(t * 4.2) * 0.65;
              targetHeadZ = Math.sin(t * 4.2) * 0.26;
              targetBodyY = Math.sin(t * 3.0) * 0.015;
            } else if (st === 'enter_house') {
              const wp = t * 10.0;
              legSwing = Math.sin(wp) * 0.48;
              targetBodyY = Math.abs(Math.sin(wp)) * 0.05;
              targetHeadX = 0.24;
            }
          } else if (s.fleePenTimer > 0) {
            // Spooked by the sheep pen -> quickly scamper away with nervous sweat drop!
            s.fleePenTimer = Math.max(0, s.fleePenTimer - dt);
            showSweat = true;
            stepForwardSafely(s, 3.35, dt, 0.85, false);
            const runPhase = t * 18.0;
            legSwing = Math.sin(runPhase) * 0.72;
            targetBodyY = Math.abs(Math.sin(runPhase)) * 0.10;
            targetBodyRoll = Math.sin(runPhase) * 0.08;
            targetHeadX = -0.14;
            targetHeadY = Math.sin(t * 22) * 0.14;
          } else if (s.scaredTimer > 0) {
            // Embarrassed & scared sheep after waking up the Golden Cat!
            s.scaredTimer = Math.max(0, s.scaredTimer - dt);
            showSweat = true;
            if (s.scaredTarget) {
              const dx = s.scaredTarget.root.position.x - s.root.position.x;
              const dz = s.scaredTarget.root.position.z - s.root.position.z;
              const dist = Math.hypot(dx, dz);
              // Face the angry cat nervously while tiptoeing slightly backward
              s.targetRotY = Math.atan2(dx, dz);
              if (dist > 0.01 && dist < 2.15) {
                const backX = s.root.position.x - (dx / dist) * 0.55 * dt;
                const backZ = s.root.position.z - (dz / dist) * 0.55 * dt;
                if (!isPositionBlocked(backX, backZ, 0)) {
                  s.root.position.x = backX;
                  s.root.position.z = backZ;
                }
              }
            }
            // Cringe low, shiver nervously, look away awkwardly
            targetBodyY = -0.055;
            targetBodyPitch = 0.14;
            targetBodyRoll = Math.sin(t * 36) * 0.085;
            targetScaleY = 0.88;
            targetScaleXZ = 1.07;
            targetHeadX = 0.34;
            targetHeadY = Math.sin(t * 22) * 0.24;
            targetHeadZ = 0.18;
            legSwing = Math.sin(t * 20) * 0.22;
          } else if (s.pairInteraction) {
            const inter = s.pairInteraction;
            const partner = inter.a === s ? inter.b : inter.a;
            const isFirst = inter.a === s;
            const dx = partner.root.position.x - s.root.position.x;
            const dz = partner.root.position.z - s.root.position.z;
            s.targetRotY = Math.atan2(dx, dz);

            if (inter.type === 'love') {
              // Scenario 1: Gentle affectionate head-to-head nuzzling
              const nuzzle = Math.sin(inter.elapsed * 4.4);
              targetHeadX = 0.12 + Math.sin(inter.elapsed * 2.8) * 0.06;
              targetHeadY = (isFirst ? 1 : -1) * nuzzle * 0.34;
              targetHeadZ = (isFirst ? 1 : -1) * (0.20 + nuzzle * 0.14);
              targetBodyPitch = 0.08;
              targetBodyRoll = (isFirst ? 1 : -1) * nuzzle * 0.08;
              targetBodyY = Math.abs(nuzzle) * 0.03;
              targetScaleY = 1.0 + Math.sin(inter.elapsed * 4.4) * 0.025;
              targetScaleXZ = 1.02;
              legSwing = Math.sin(inter.elapsed * 4.4) * 0.10;
            } else {
              // Scenario 2: Fierce cartoon headbutting fight!
              const phase = (inter.elapsed * 3.1) % 1.0;
              if (phase < 0.38) {
                const p = phase / 0.38;
                targetBodyPitch = -0.10 * p;
                targetHeadX = 0.22 + 0.35 * p;
                targetBodyY = 0.05 * Math.sin(p * Math.PI);
                targetScaleXZ = 1.0 + 0.07 * p;
                targetScaleY = 1.0 - 0.06 * p;
                legSwing = Math.sin(inter.elapsed * 22) * 0.35;
              } else if (phase < 0.62) {
                const p = (phase - 0.38) / 0.24;
                const lunge = Math.sin(p * Math.PI);
                targetBodyPitch = 0.34 * lunge;
                targetHeadX = 0.68 * lunge;
                targetBodyY = 0.14 * lunge;
                targetBodyRoll = (isFirst ? 1 : -1) * Math.sin(inter.elapsed * 32) * 0.14;
                targetScaleXZ = 1.08;
                targetScaleY = 0.93;
                legSwing = 0.52 * lunge;
              } else {
                const p = (phase - 0.62) / 0.38;
                const recoil = Math.sin(p * Math.PI);
                targetBodyPitch = -0.18 * recoil;
                targetHeadX = -0.18 * recoil;
                targetHeadY = Math.sin(inter.elapsed * 28) * 0.22;
                targetBodyY = 0.06 * recoil;
                targetScaleY = 1.05 * recoil + (1 - recoil);
                legSwing = -0.35 * recoil;
              }
            }
          } else if (s.vaultTime > 0) {
            // Playful parabolic leap right over another sheep!
            s.vaultTime += dt * 1.45;
            const vc = Math.min(1.0, s.vaultTime);
            if (vc < 0.14) {
              const p = vc / 0.14;
              targetBodyY = -0.05 * Math.sin(p * Math.PI);
              targetScaleY = 1 - 0.13 * Math.sin(p * Math.PI);
              targetScaleXZ = 1 + 0.08 * Math.sin(p * Math.PI);
              targetHeadX = 0.14;
            } else if (vc < 0.78) {
              const p = (vc - 0.14) / 0.64;
              const arc = Math.sin(p * Math.PI);
              stepForwardSafely(s, 2.75, dt, 0.75, true);
              targetBodyY = arc * 1.48;
              targetScaleY = 1 + arc * 0.13;
              targetScaleXZ = 1 - arc * 0.06;
              targetHeadX = -0.24 * arc;
              legSwing = 0.62 * arc;
            } else {
              const p = (vc - 0.78) / 0.22;
              const squash = Math.sin(p * Math.PI) * Math.exp(-p * 1.6);
              targetBodyY = -0.04 * squash;
              targetScaleY = 1 - 0.14 * squash;
              targetScaleXZ = 1 + 0.10 * squash;
              targetHeadX = 0.10 * squash;
            }
            if (s.vaultTime >= 1.0) {
              s.vaultTime = 0;
            }
          } else if (s.celebrateTimer > 0) {
            // Stop in place, face the reborn sheep, gently sway head & clap '👏' in celebration!
            s.celebrateTimer = Math.max(0, s.celebrateTimer - dt);
            showClap = true;
            if (s.celebrateTarget && !s.celebrateTarget.deleting) {
              s.targetRotY = Math.atan2(
                s.celebrateTarget.root.position.x - s.root.position.x,
                s.celebrateTarget.root.position.z - s.root.position.z
              );
            }
            const sway = Math.sin(t * 5.2);
            targetHeadX = -0.14 + Math.sin(t * 10.4) * 0.06;
            targetHeadY = sway * 0.34;
            targetHeadZ = sway * 0.22;
            targetBodyY = Math.abs(sway) * 0.035;
            targetBodyRoll = sway * 0.05;
          } else if (s.rebirthTimer > 0) {
            // Magical golden wool rebirth shake & joyful little hop!
            s.rebirthTimer = Math.max(0, s.rebirthTimer - dt);
            const p = 1 - s.rebirthTimer / 1.85;
            if (p < 0.45) {
              targetBodyRoll = Math.sin(t * 42) * 0.16;
              targetBodyY = -0.04;
              targetScaleY = 0.92;
              targetScaleXZ = 1.08;
            } else {
              const hopP = Math.min(1, (p - 0.45) / 0.45);
              const arc = Math.sin(hopP * Math.PI);
              targetBodyY = arc * 0.65;
              targetScaleY = 1.0 + arc * 0.14;
              targetScaleXZ = 1.0 - arc * 0.06;
              targetHeadX = -0.22 * arc;
              legSwing = 0.42 * arc;
            }
          } else if (s.drinkTimer > 0) {
            // Dip head down to sip river water + spawn delicate white water ripples!
            s.drinkTimer = Math.max(0, s.drinkTimer - dt);
            const rCx = getRiverCenterX(s.root.position.z);
            s.targetRotY = Math.atan2(rCx - s.root.position.x, 0);
            targetBodyPitch = 0.28;
            targetBodyY = -0.05;
            targetHeadX = 1.05 + Math.sin(t * 7.5) * 0.08;
            s.drinkRippleT -= dt;
            if (s.drinkRippleT <= 0) {
              const side = s.root.position.x >= rCx ? 1 : -1;
              spawnWaterRipple(rCx + side * (getRiverHalfWidth(s.root.position.z) * 0.72), s.root.position.z, 1.5);
              s.drinkRippleT = 0.75;
            }
          } else if (s.shakeTimer > 0) {
            // Brisk full-body wool shake-off!
            s.shakeTimer = Math.max(0, s.shakeTimer - dt);
            targetBodyRoll = Math.sin(t * 48) * 0.24;
            targetHeadZ = -Math.sin(t * 48) * 0.30;
            targetScaleXZ = 1.06;
            targetScaleY = 0.96;
          } else if (weatherMode === 'rain' && s.state !== 'Jump') {
            // Seek shelter gently near the closest tree canopy during light rain!
            let bestT = treeSpecs[0];
            let bestD = Infinity;
            for (let k = 0; k < treeSpecs.length; k++) {
              const tr = treeSpecs[k];
              if (isInsidePen(tr.x, tr.z, 1.2)) continue;
              const d = Math.hypot(tr.x - s.root.position.x, tr.z - s.root.position.z);
              if (d < bestD) { bestD = d; bestT = tr; }
            }
            if (bestD > 1.75) {
              s.targetRotY = Math.atan2(bestT.x - s.root.position.x, bestT.z - s.root.position.z);
              stepForwardSafely(s, 1.45, dt, 0.78, false);
              const wp = t * 9.5;
              legSwing = Math.sin(wp) * 0.50;
              targetBodyY = Math.abs(Math.sin(wp)) * 0.05;
            } else {
              targetBodyY = -0.03;
              targetHeadX = 0.24;
            }
          } else if (s.followLeader) {
            s.followTimer -= dt;
            const ld = s.followLeader;
            if (s.followTimer <= 0 || !ld || ld.deleting || ld.grabbed || ld.herded) {
              s.followLeader = null;
            } else {
              const dx = ld.root.position.x - s.root.position.x;
              const dz = ld.root.position.z - s.root.position.z;
              const dist = Math.hypot(dx, dz);
              if (dist > 1.35 && dist < 6.0) {
                s.targetRotY = Math.atan2(dx, dz);
                stepForwardSafely(s, 1.18, dt, 0.75, false);
                const wp = t * 8.5;
                legSwing = Math.sin(wp) * 0.48;
                targetBodyY = Math.abs(Math.sin(wp)) * 0.05;
              } else if (dist >= 6.0) {
                s.followLeader = null;
              }
            }
          } else if (s.state === 'Idle') {
            s.idleTimer -= dt;
            if (s.idleTimer <= 0) {
              const allModes = ['lookup', 'spin', 'gaze', 'still'];
              const others = allModes.filter(m => m !== s.idleMode);
              s.idleMode = others[(Math.random() * others.length) | 0];
              s.idleTimer = 2.4 + Math.random() * 2.4;
              if (s.idleMode === 'spin') {
                s.idleSpinDir = Math.random() < 0.5 ? 1 : -1;
              }
            }

            if (s.idleMode === 'lookup') {
              // Look up curiously with cartoon '?' above head
              showQuestion = true;
              targetHeadX = -0.58 + Math.sin(t * 2.6) * 0.05;
              targetHeadY = Math.sin(t * 1.5) * 0.16;
              targetHeadZ = Math.sin(t * 2.2) * 0.22;
              targetBodyPitch = -0.10;
              targetBodyY = Math.sin(t * 2.2) * 0.014;
            } else if (s.idleMode === 'spin') {
              // Slowly turn in a circle on the spot with tiny pitter-patter steps
              s.targetRotY += s.idleSpinDir * 1.05 * dt;
              const stepPhase = t * 5.6;
              legSwing = Math.sin(stepPhase) * 0.24;
              targetBodyY = Math.abs(Math.sin(stepPhase)) * 0.028;
              targetHeadX = -0.05;
              targetHeadY = s.idleSpinDir * 0.22;
            } else if (s.idleMode === 'gaze') {
              // Calmly gaze straight ahead
              targetHeadX = -0.08;
              targetHeadY = 0.0;
              targetBodyY = Math.sin(t * 1.6) * 0.01;
            } else {
              // Purely still, zoning out
              targetHeadX = 0.06;
              targetHeadY = 0.0;
              targetBodyY = Math.sin(t * 1.1) * 0.004;
            }
          } else if (s.state === 'Graze') {
            // Never graze on the wooden bridge or beige dirt path: keep walking until on grass
            const onGrass = canGrazeAt(s.root.position.x, s.root.position.z, s.root.rotation.y);
            if (s.grazePhase === 'eat' && !onGrass) {
              s.grazePhase = 'walk';
              s.grazeTimer = 0.65;
            }

            // Eat grass deeply for 3s -> random walk for random seconds -> repeat
            s.grazeTimer -= dt;
            if (s.grazePhase === 'walk') {
              stepForwardSafely(s, 1.08, dt, 0.72);
              s.walkTurnTimer -= dt;
              if (s.walkTurnTimer <= 0 && s.avoidCooldown <= 0) {
                s.targetRotY += (Math.random() - 0.5) * 1.1;
                s.walkTurnTimer = 1.5 + Math.random() * 2.2;
              }
              const walkPhase = t * 8.2;
              legSwing = Math.sin(walkPhase) * 0.45;
              targetBodyY = Math.abs(Math.sin(walkPhase)) * 0.05;
              targetHeadX = 0.16 + Math.sin(walkPhase * 2) * 0.05;

              if (s.grazeTimer <= 0) {
                if (canGrazeAt(s.root.position.x, s.root.position.z, s.root.rotation.y)) {
                  s.grazePhase = 'eat';
                  s.grazeTimer = 3.0;
                  s.nibbleFxTimer = 0.15;
                } else {
                  // Still on bridge or path — keep walking a bit longer to reach grass
                  s.grazeTimer = 0.5;
                }
              }
            } else {
              // Rich leaning-forward grazing with rhythmic chewing, grass tug, and nibble bits
              const chew = Math.sin(t * 10.5);
              const tug = Math.pow(Math.max(0, Math.sin(t * 3.1)), 4);
              targetBodyPitch = 0.26 + chew * 0.03 - tug * 0.09;
              targetBodyY = -0.055 + chew * 0.014 + tug * 0.03;
              targetHeadX = 1.04 + chew * 0.15 - tug * 0.28;
              targetHeadY = Math.sin(t * 2.6) * 0.30;
              targetScaleY = 1.0 - 0.04 + chew * 0.02;
              targetScaleXZ = 1.0 + 0.03 - chew * 0.015;

              s.nibbleFxTimer -= dt;
              if (s.nibbleFxTimer <= 0) {
                spawnGrassNibbles(s);
                s.nibbleFxTimer = 0.42 + Math.random() * 0.28;
              }

              if (s.grazeTimer <= 0) {
                s.grazePhase = 'walk';
                s.grazeTimer = 1.8 + Math.random() * 2.8;
                if (s.avoidCooldown <= 0) {
                  s.targetRotY += (Math.random() - 0.5) * 1.3;
                }
              }
            }
          } else if (s.state === 'Walk') {
            // Smooth forward walking with reliable riverbank & border avoidance
            stepForwardSafely(s, 1.15, dt, 0.72);

            s.walkTurnTimer -= dt;
            if (s.walkTurnTimer <= 0 && s.avoidCooldown <= 0) {
              s.targetRotY += (Math.random() - 0.5) * 1.15;
              s.walkTurnTimer = 2.4 + Math.random() * 3.0;
            }

            const walkPhase = t * 8.5;
            legSwing = Math.sin(walkPhase) * 0.48;
            targetBodyY = Math.abs(Math.sin(walkPhase)) * 0.055;
            targetHeadX = 0.10 + Math.sin(walkPhase * 2) * 0.04;
          } else if (s.state === 'Jump') {
            // Forward jump -> land -> random walk for random seconds -> jump again
            if (s.jumpPhase === 'walk') {
              stepForwardSafely(s, 1.15, dt, 0.75);
              s.walkTurnTimer -= dt;
              if (s.walkTurnTimer <= 0 && s.avoidCooldown <= 0) {
                s.targetRotY += (Math.random() - 0.5) * 1.1;
                s.walkTurnTimer = 1.6 + Math.random() * 2.2;
              }

              const walkPhase = t * 8.5;
              legSwing = Math.sin(walkPhase) * 0.48;
              targetBodyY = Math.abs(Math.sin(walkPhase)) * 0.055;
              targetHeadX = 0.10 + Math.sin(walkPhase * 2) * 0.04;

              s.jumpWalkTimer -= dt;
              if (s.jumpWalkTimer <= 0) {
                // Before next hop, ensure facing away from river/edge
                const dirX = Math.sin(s.root.rotation.y);
                const dirZ = Math.cos(s.root.rotation.y);
                if (isPositionBlocked(s.root.position.x + dirX * 1.35, s.root.position.z + dirZ * 1.35, 0.1)) {
                  s.targetRotY = computeSafeEscapeAngle(s.root.position.x, s.root.position.z);
                  s.avoidCooldown = 0.5;
                }
                s.jumpPhase = 'hop';
                s.jumpTime = 0;
              }
            } else {
              // Forward parabolic hop cycle
              s.jumpTime += dt * 1.25;
              const cycle = Math.min(1.0, s.jumpTime);
              if (cycle < 0.18) {
                // Anticipation crouch (also steer safely if right next to river)
                const dirX = Math.sin(s.root.rotation.y);
                const dirZ = Math.cos(s.root.rotation.y);
                if (isPositionBlocked(s.root.position.x + dirX * 1.25, s.root.position.z + dirZ * 1.25, 0.1) && s.avoidCooldown <= 0) {
                  s.targetRotY = computeSafeEscapeAngle(s.root.position.x, s.root.position.z);
                  s.avoidCooldown = 0.5;
                }
                const p = cycle / 0.18;
                targetBodyY = -0.06 * Math.sin(p * Math.PI);
                targetScaleY = 1 - 0.14 * Math.sin(p * Math.PI);
                targetScaleXZ = 1 + 0.09 * Math.sin(p * Math.PI);
                targetHeadX = 0.18;
              } else if (cycle < 0.74) {
                // Forward airborne leap
                const p = (cycle - 0.18) / 0.56;
                const arc = Math.sin(p * Math.PI);
                stepForwardSafely(s, 2.55, dt, 0.85, true);
                targetBodyY = arc * 1.45;
                targetScaleY = 1 + arc * 0.12;
                targetScaleXZ = 1 - arc * 0.06;
                targetHeadX = -0.22 * arc;
                legSwing = 0.55 * arc;
              } else {
                // Soft elastic landing recovery
                const p = (cycle - 0.74) / 0.26;
                const squash = Math.sin(p * Math.PI) * Math.exp(-p * 1.6);
                targetBodyY = -0.04 * squash;
                targetScaleY = 1 - 0.14 * squash;
                targetScaleXZ = 1 + 0.10 * squash;
                targetHeadX = 0.12 * squash;
              }

              if (s.jumpTime >= 1.0) {
                s.jumpPhase = 'walk';
                s.jumpWalkTimer = 1.6 + Math.random() * 2.6;
                if (s.avoidCooldown <= 0) {
                  s.targetRotY += (Math.random() - 0.5) * 0.9;
                }
              }
            }
          }

          // Smoothly blend pose transitions
          const lerpK = Math.min(1, dt * 11);
          s.headPivot.rotation.x += (targetHeadX - s.headPivot.rotation.x) * lerpK;
          s.headPivot.rotation.y += (targetHeadY - s.headPivot.rotation.y) * lerpK;
          s.headPivot.rotation.z += (targetHeadZ - s.headPivot.rotation.z) * lerpK;

          // Animate floating cartoon '?' sprite above head
          if (showQuestion) {
            s.qPop = Math.min(1, s.qPop + dt * 5.2);
          } else {
            s.qPop = Math.max(0, s.qPop - dt * 6.5);
          }
          if (s.qPop > 0.01) {
            s.qSprite.visible = true;
            const bounce = s.qPop < 1 ? (1 + Math.sin(s.qPop * Math.PI) * 0.25) : 1;
            const sz = 0.82 * s.qPop * bounce;
            s.qSprite.scale.set(sz, sz, 1);
            s.qSprite.position.y = 1.62 + Math.sin(t * 4.2) * 0.07 + (1 - s.qPop) * -0.18;
            s.qSprite.material.opacity = Math.min(1, s.qPop * 1.25);
            s.qSprite.material.rotation = Math.sin(t * 3.4) * 0.14;
          } else {
            s.qSprite.visible = false;
          }
          if (s.dropSquash > 0) {
            const sq = Math.sin(s.dropSquash * Math.PI) * 0.18;
            targetScaleY -= sq;
            targetScaleXZ += sq * 0.75;
            targetBodyY -= sq * 0.22;
          }

          s.bodyRig.position.y += (targetBodyY - s.bodyRig.position.y) * Math.min(1, dt * 16);
          s.bodyRig.rotation.x += (targetBodyPitch - s.bodyRig.rotation.x) * Math.min(1, dt * 12);
          s.bodyRig.rotation.z += (targetBodyRoll - s.bodyRig.rotation.z) * Math.min(1, dt * 14);
          const baseS = 1.16;
          s.bodyRig.scale.y += (targetScaleY * baseS - s.bodyRig.scale.y) * Math.min(1, dt * 14);
          s.bodyRig.scale.x += (targetScaleXZ * baseS - s.bodyRig.scale.x) * Math.min(1, dt * 14);
          s.bodyRig.scale.z += (targetScaleXZ * baseS - s.bodyRig.scale.z) * Math.min(1, dt * 14);

          // Animate cute angry icon sprite above head
          if (showAngry) {
            s.angryPop = Math.min(1, s.angryPop + dt * 6.5);
          } else {
            s.angryPop = Math.max(0, s.angryPop - dt * 6.5);
          }
          if (s.angryPop > 0.01) {
            s.angrySprite.visible = true;
            const pulse = 1 + Math.sin(t * 14) * 0.11;
            const sz = 0.66 * s.angryPop * pulse;
            s.angrySprite.scale.set(sz, sz, 1);
            s.angrySprite.position.y = 1.48 + Math.sin(t * 12) * 0.04;
            s.angrySprite.material.opacity = Math.min(1, s.angryPop * 1.25);
            s.angrySprite.material.rotation = Math.sin(t * 20) * 0.14;
          } else {
            s.angrySprite.visible = false;
          }

          // Animate cute awkward sweat-drop sprite ('💦')
          if (showSweat) {
            s.sweatPop = Math.min(1, s.sweatPop + dt * 6.0);
          } else {
            s.sweatPop = Math.max(0, s.sweatPop - dt * 6.5);
          }
          if (s.sweatPop > 0.01) {
            s.sweatSprite.visible = true;
            const sz = 0.72 * s.sweatPop * (1 + Math.sin(t * 8) * 0.06);
            s.sweatSprite.scale.set(sz, sz, 1);
            // Gentle nervous drip bobbing
            const drip = ((t * 1.4) % 1.0);
            s.sweatSprite.position.y = 1.58 - drip * 0.14;
            s.sweatSprite.material.opacity = Math.min(1, s.sweatPop * (1.15 - drip * 0.25));
            s.sweatSprite.material.rotation = Math.sin(t * 16) * 0.08;
          } else {
            s.sweatSprite.visible = false;
          }

          // Animate cute clapping hands celebration sticker ('👏')
          if (showClap) {
            s.clapPop = Math.min(1, s.clapPop + dt * 5.8);
          } else {
            s.clapPop = Math.max(0, s.clapPop - dt * 6.5);
          }
          if (s.clapPop > 0.01) {
            s.clapSprite.visible = true;
            const clapPulse = 1 + Math.abs(Math.sin(t * 7.5)) * 0.14;
            const sz = 0.86 * s.clapPop * clapPulse;
            s.clapSprite.scale.set(sz, sz, 1);
            s.clapSprite.position.y = 1.62 + Math.sin(t * 5.2) * 0.07;
            s.clapSprite.material.opacity = Math.min(1, s.clapPop * 1.25);
            s.clapSprite.material.rotation = Math.sin(t * 7.5) * 0.12;
          } else {
            s.clapSprite.visible = false;
          }

          // Dynamic contact AO shadow shrinks & softens as sheep jumps or is lifted
          const airHeight = Math.max(0, (s.root.position.y - getGroundY(s.root.position.x, s.root.position.z)) + s.bodyRig.position.y);
          const aoFactor = Math.max(0.18, 1 - airHeight * 0.42);
          s.sheepAO.position.y = 0.015 - Math.max(0, s.root.position.y - getGroundY(s.root.position.x, s.root.position.z));
          s.sheepAO.scale.set(1.12 * aoFactor, 1.36 * aoFactor, 1);
          s.sheepAO.material.opacity = 0.68 * aoFactor;

          // Apply leg swing (independent frantic flailing when grabbed)
          const backVal = legSwingBack !== null ? legSwingBack : legSwing;
          const legRate = s.grabbed ? Math.min(1, dt * 24) : lerpK;
          s.legs[0].rotation.x += (legSwing - s.legs[0].rotation.x) * legRate;
          s.legs[1].rotation.x += (-legSwing - s.legs[1].rotation.x) * legRate;
          s.legs[2].rotation.x += (-backVal - s.legs[2].rotation.x) * legRate;
          s.legs[3].rotation.x += (backVal - s.legs[3].rotation.x) * legRate;
        }

        // Detect if a jumping/vaulting sheep steps on or lands onto another sheep
        for (let i = 0; i < sheepList.length; i++) {
          const jumper = sheepList[i];
          if (jumper.deleting || jumper.grabbed) continue;
          const airY = jumper.bodyRig.position.y;
          if (airY > 0.45) {
            jumper.wasAirborne = true;
          } else if (jumper.wasAirborne && airY < 0.32) {
            jumper.wasAirborne = false;
            for (let j = 0; j < sheepList.length; j++) {
              const victim = sheepList[j];
              if (victim === jumper || victim.deleting || victim.grabbed) continue;
              if (victim.steppedCooldown > 0 || victim.bodyRig.position.y > 0.35) continue;
              const d = Math.hypot(
                jumper.root.position.x - victim.root.position.x,
                jumper.root.position.z - victim.root.position.z
              );
              if (d < 1.15) {
                victim.dropSquash = 1.0;
                victim.angerTimer = 2.6;
                victim.angerLookTarget = jumper;
                victim.steppedCooldown = 2.2;
              }
            }
          }
        }

        resolveSheepCollisions(dt);
      }

      // ------------------------------------------------------------------
      // 8. 3D -> 2D Dynamic Bounding Box Projection & Floating Toolbar
      // ------------------------------------------------------------------
      const tempBox = new THREE.Box3();
      const tempCorners = Array.from({ length: 8 }, () => new THREE.Vector3());
      const tempCenter = new THREE.Vector3();

      function getScreenBounds(sheep) {
        sheep.root.updateMatrixWorld(true);
        // Compute tight world bounding box from visible meshes (excluding invisible hit proxy)
        tempBox.makeEmpty();
        sheep.bodyRig.traverse(obj => {
          if (obj.isMesh && obj !== sheep.hitMesh) {
            tempBox.expandByObject(obj);
          }
        });

        const min = tempBox.min;
        const max = tempBox.max;
        tempCorners[0].set(min.x, min.y, min.z);
        tempCorners[1].set(min.x, min.y, max.z);
        tempCorners[2].set(min.x, max.y, min.z);
        tempCorners[3].set(min.x, max.y, max.z);
        tempCorners[4].set(max.x, min.y, min.z);
        tempCorners[5].set(max.x, min.y, max.z);
        tempCorners[6].set(max.x, max.y, min.z);
        tempCorners[7].set(max.x, max.y, max.z);

        const w = stage.clientWidth;
        const h = stage.clientHeight;
        let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;

        for (let i = 0; i < 8; i++) {
          tempCorners[i].project(camera);
          const sx = (tempCorners[i].x * 0.5 + 0.5) * w;
          const sy = (-tempCorners[i].y * 0.5 + 0.5) * h;
          if (sx < minX) minX = sx;
          if (sx > maxX) maxX = sx;
          if (sy < minY) minY = sy;
          if (sy > maxY) maxY = sy;
        }

        tempBox.getCenter(tempCenter);
        const dist = camera.position.distanceTo(tempCenter);

        // Live jump height expands displayed height dynamically just like the video
        const worldHeightBonus = Math.max(0, sheep.bodyRig.position.y) * 0.58;
        const displayW = sheep.dimScaleW + (sheep.state === 'Walk' ? 0.04 : 0);
        const displayH = sheep.dimScaleH + worldHeightBonus;

        const pad = 7;
        return {
          left: minX - pad,
          top: minY - pad,
          width: Math.max(24, maxX - minX + pad * 2),
          height: Math.max(24, maxY - minY + pad * 2),
          centerX: (minX + maxX) / 2,
          bottom: maxY + pad,
          dist: Math.round(dist),
          displayW: displayW.toFixed(2),
          displayH: displayH.toFixed(2)
        };
      }

      // Add 5th & 6th state button slots inside toolbar (shown only when Golden Cat is selected)
      const firstDivider = toolbarEl.querySelector('.tb-divider');
      for (let k = 0; k < 2; k++) {
        const extraBtn = document.createElement('button');
        extraBtn.className = 'tb-btn';
        extraBtn.type = 'button';
        extraBtn.style.display = 'none';
        toolbarEl.insertBefore(extraBtn, firstDivider);
        stateButtons.push(extraBtn);
      }

      function syncToolbarActiveButton() {
        if (!selectedSheep) return;
        const isCat = Boolean(selectedSheep.isCat);
        const cfg = isCat ? CAT_STATES : SHEEP_STATES_UI;
        stateButtons.forEach((btn, idx) => {
          if (idx < cfg.length) {
            btn.style.display = '';
            btn.dataset.state = cfg[idx].id;
            btn.textContent = cfg[idx].label;
            btn.classList.toggle('active', cfg[idx].id === selectedSheep.state);
          } else {
            btn.style.display = 'none';
          }
        });
        btnDuplicate.style.display = isCat ? 'none' : '';
        btnDelete.style.display = isCat ? 'none' : '';
      }

      function updateSelectionUI() {
        // Hover outline (only when hovering an unselected sheep)
        if (hoveredSheep && hoveredSheep !== selectedSheep && !hoveredSheep.deleting) {
          const hb = getScreenBounds(hoveredSheep);
          hoverBoxEl.style.display = 'block';
          hoverBoxEl.style.left = hb.left + 'px';
          hoverBoxEl.style.top = hb.top + 'px';
          hoverBoxEl.style.width = hb.width + 'px';
          hoverBoxEl.style.height = hb.height + 'px';
        } else {
          hoverBoxEl.style.display = 'none';
        }

        if (!selectedSheep || selectedSheep.deleting || selectedSheep.grabbed) {
          selectionBoxEl.style.display = 'none';
          dimensionPillEl.style.display = 'none';
          toolbarEl.style.display = 'none';
          return;
        }

        const b = getScreenBounds(selectedSheep);
        selectionBoxEl.style.display = 'block';
        selectionBoxEl.style.left = b.left + 'px';
        selectionBoxEl.style.top = b.top + 'px';
        selectionBoxEl.style.width = b.width + 'px';
        selectionBoxEl.style.height = b.height + 'px';

        // Dimension & distance pill
        dimensionPillEl.style.display = 'block';
        dimensionPillEl.textContent = `${b.displayW} × ${b.displayH} m · ${b.dist} m away`;
        const pillLeft = Math.max(85, Math.min(stage.clientWidth - 85, b.centerX));
        const pillTop = Math.min(stage.clientHeight - 76, b.bottom + 8);
        dimensionPillEl.style.left = pillLeft + 'px';
        dimensionPillEl.style.top = pillTop + 'px';

        // Floating toolbar directly beneath pill, clamped within viewport
        toolbarEl.style.display = 'flex';
        const tbHalfW = Math.max(150, toolbarEl.offsetWidth / 2);
        const tbLeft = Math.max(tbHalfW + 10, Math.min(stage.clientWidth - tbHalfW - 10, b.centerX));
        const tbTop = Math.min(stage.clientHeight - 46, pillTop + 28);
        toolbarEl.style.left = tbLeft + 'px';
        toolbarEl.style.top = tbTop + 'px';
      }

      const ALL_SHEEP_STATES = ['Idle', 'Graze', 'Walk', 'Jump'];
      function pickRandomState() {
        return ALL_SHEEP_STATES[(Math.random() * ALL_SHEEP_STATES.length) | 0];
      }

      let autoDeselectTimer = null;
      function clearAutoDeselect() {
        if (autoDeselectTimer !== null) {
          clearTimeout(autoDeselectTimer);
          autoDeselectTimer = null;
        }
      }

      function selectSheep(sheep, autoDismissMs) {
        clearAutoDeselect();
        selectedSheep = sheep;
        if (sheep) {
          syncToolbarActiveButton();
          // Re-trigger subtle toolbar pop animation when switching targets
          toolbarEl.style.animation = 'none';
          void toolbarEl.offsetWidth;
          toolbarEl.style.animation = '';
          if (autoDismissMs && autoDismissMs > 0) {
            const targetSheep = sheep;
            autoDeselectTimer = setTimeout(() => {
              if (selectedSheep === targetSheep) {
                selectSheep(null);
              }
            }, autoDismissMs);
          }
        }
        updateSelectionUI();
      }

      // ------------------------------------------------------------------
      // 9. Raycasting, Circle-to-Spawn Drawing & Pointer Interactions
      // ------------------------------------------------------------------
      const raycaster = new THREE.Raycaster();
      const pointer = new THREE.Vector2();
      const groundPlane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
      const groundHit = new THREE.Vector3();
      let downPos = { x: 0, y: 0 };

      const drawState = {
        active: false,
        points: [],
        fadeTimer: null
      };

      const grabState = {
        candidate: null,
        active: false,
        originX: 0,
        originZ: 0,
        validDrop: true,
        blockedByPen: false,
        dropX: 0,
        dropZ: 0
      };

      function raycastGroundRaw(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.ray.intersectPlane(groundPlane, groundHit);
        return hit ? hit.clone() : null;
      }

      function pickSheep(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);

        const hitMeshes = sheepList.filter(s => !s.deleting).map(s => s.hitMesh);
        if (goldenCat) hitMeshes.push(goldenCat.hitMesh);
        const hits = raycaster.intersectObjects(hitMeshes, false);
        return hits.length > 0 ? hits[0].object.userData.sheep : null;
      }

      function pickMeadowPoint(clientX, clientY) {
        const rect = canvas.getBoundingClientRect();
        pointer.x = ((clientX - rect.left) / rect.width) * 2 - 1;
        pointer.y = -((clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(pointer, camera);
        const hit = raycaster.ray.intersectPlane(groundPlane, groundHit);
        if (!hit) return null;
        if (hit.x >= TERRAIN_MIN_X + 0.85 && hit.x <= TERRAIN_MAX_X - 0.85 && Math.abs(hit.z) <= SLAB_D / 2 - 0.85) {
          return hit.clone();
        }
        return null;
      }

      function renderDrawStroke(points) {
        if (points.length < 2) {
          drawPathEl.setAttribute('d', '');
          return;
        }
        let dStr = `M ${points[0].x.toFixed(1)} ${points[0].y.toFixed(1)}`;
        for (let i = 1; i < points.length; i++) {
          dStr += ` L ${points[i].x.toFixed(1)} ${points[i].y.toFixed(1)}`;
        }
        drawPathEl.setAttribute('d', dStr);
      }

      function triggerSpawnRing(x, y, radius) {
        spawnRingEl.setAttribute('cx', x.toFixed(1));
        spawnRingEl.setAttribute('cy', y.toFixed(1));
        spawnRingEl.setAttribute('r', Math.max(14, Math.min(34, radius)).toFixed(1));
        spawnRingEl.classList.remove('pop');
        void spawnRingEl.offsetWidth;
        spawnRingEl.classList.add('pop');
      }

      function trySpawnFromCircle(points) {
        if (points.length < 8) return false;
        let minX = Infinity, maxX = -Infinity, minY = Infinity, maxY = -Infinity;
        let pathLen = 0;
        let sumX = 0, sumY = 0;
        for (let i = 0; i < points.length; i++) {
          const p = points[i];
          if (p.x < minX) minX = p.x;
          if (p.x > maxX) maxX = p.x;
          if (p.y < minY) minY = p.y;
          if (p.y > maxY) maxY = p.y;
          sumX += p.x;
          sumY += p.y;
          if (i > 0) {
            pathLen += Math.hypot(p.x - points[i - 1].x, p.y - points[i - 1].y);
          }
        }
        const bw = maxX - minX;
        const bh = maxY - minY;
        const diag = Math.hypot(bw, bh);
        if (pathLen < 45 || bw < 14 || bh < 14) return false;

        const cx = sumX / points.length;
        const cy = sumY / points.length;
        const endGap = Math.hypot(
          points[points.length - 1].x - points[0].x,
          points[points.length - 1].y - points[0].y
        );

        // Compute total swept angle around centroid so quick hand-drawn circles reliably trigger
        let totalSweep = 0;
        for (let i = 1; i < points.length; i++) {
          const a1 = Math.atan2(points[i - 1].y - cy, points[i - 1].x - cx);
          const a2 = Math.atan2(points[i].y - cy, points[i].x - cx);
          totalSweep += shortestAngleDiff(a1, a2);
        }

        const isCircleLike = Math.abs(totalSweep) >= Math.PI * 1.15 || endGap <= diag * 0.65;
        if (!isCircleLike) return false;

        const rect = canvas.getBoundingClientRect();
        const worldPt = pickMeadowPoint(rect.left + cx, rect.top + cy);
        if (!worldPt) {
          showToast('请在草地区域画圈生成小羊');
          return true;
        }
        if (isInsidePen(worldPt.x, worldPt.z, 0.25)) {
          showToast('羊这么可爱，不要这么残忍');
          return true;
        }
        if (isInRiver(worldPt.x, worldPt.z, RIVER_MARGIN) && !isOnBridge(worldPt.x, worldPt.z, 0)) {
          showToast('河道上不能放羊，请在草地或木桥上画圈');
          return true;
        }
        if (sheepList.length >= 24) {
          showToast('草地最多容纳 24 只小羊');
          return true;
        }

        const clampedX = Math.max(SLAB_MIN_X, Math.min(SLAB_MAX_X, worldPt.x));
        const clampedZ = Math.max(-SLAB_MARGIN_Z, Math.min(SLAB_MARGIN_Z, worldPt.z));
        const newSheep = createSheep(clampedX, clampedZ, Math.random() * Math.PI * 2, pickRandomState());
        triggerSpawnRing(cx, cy, (bw + bh) * 0.25);
        selectSheep(newSheep, 5000);
        return true;
      }

      canvas.addEventListener('pointermove', (e) => {
        if (grabState.candidate) {
          const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);
          if (!grabState.active && moved >= 7) {
            grabState.active = true;
            grabState.candidate.grabbed = true;
            grabState.candidate.angerTimer = 0;
            grabState.candidate.scaredTimer = 0;
            grabState.candidate.fleePenTimer = 0;
            grabState.candidate.celebrateTimer = 0;
            if (grabState.candidate.isCat) {
              grabState.candidate.boltingTimer = 0;
              grabState.candidate.wakeStretchTimer = 0;
              grabState.candidate.watchFish = null;
              grabState.candidate.reefAction = null;
              grabState.candidate.onRoofTimer = 0;
              grabState.candidate.butterflyHunt = null;
            }
            if (grabState.candidate.pairInteraction) {
              clearPairInteraction(grabState.candidate.pairInteraction);
            }
            hoveredSheep = null;
            updateSelectionUI();
          }
          if (grabState.active) {
            const pt = raycastGroundRaw(e.clientX, e.clientY);
            if (pt) {
              const inSlab = pt.x >= SLAB_MIN_X && pt.x <= SLAB_MAX_X && Math.abs(pt.z) <= SLAB_MARGIN_Z;
              const onReefForCat = grabState.candidate.isCat && isOnReef(pt.x, pt.z, 0.28);
              const blockedRiver = isInRiver(pt.x, pt.z, RIVER_MARGIN) && !isOnBridge(pt.x, pt.z, 0) && !onReefForCat;
              const onRoofForCat = grabState.candidate.isCat && isInsideHouseFootprint(pt.x, pt.z, 0.15);
              const blockedHouse = isInsideHouseFootprint(pt.x, pt.z, 0.25) && !onRoofForCat;
              const blockedPen = !grabState.candidate.isCat && isInsidePen(pt.x, pt.z, 0.22);
              grabState.blockedByPen = blockedPen;
              grabState.validDrop = inSlab && !blockedRiver && !blockedHouse && !blockedPen;
              grabState.dropX = pt.x;
              grabState.dropZ = pt.z;

              // Follow pointer smoothly while clamped to visible area
              const followX = Math.max(TERRAIN_MIN_X - 2.0, Math.min(TERRAIN_MAX_X + 2.0, pt.x));
              const followZ = Math.max(-SLAB_D * 0.65, Math.min(SLAB_D * 0.65, pt.z));
              grabState.candidate.root.position.x = followX;
              grabState.candidate.root.position.z = followZ;

              dropRingMesh.visible = true;
              dropRingMesh.position.set(followX, getGroundY(followX, followZ) + 0.04, followZ);
              dropRingMat.color.setHex(grabState.validDrop ? 0x2563eb : 0xef4444);
            }
            setCanvasCursor('grabbing');
            return;
          }
        }

        if (camState.orbitEnabled && camState.dragging) {
          const dx = e.clientX - camState.lastX;
          const dy = e.clientY - camState.lastY;
          camState.lastX = e.clientX;
          camState.lastY = e.clientY;
          camState.azimuth -= dx * 0.006;
          camState.elevation = Math.max(0.32, Math.min(1.32, camState.elevation + dy * 0.005));
          updateCameraTransform();
          setCanvasCursor('grabbing');
          return;
        }

        if (drawState.active) {
          const rect = canvas.getBoundingClientRect();
          const lx = e.clientX - rect.left;
          const ly = e.clientY - rect.top;
          const last = drawState.points[drawState.points.length - 1];
          if (!last || Math.hypot(lx - last.x, ly - last.y) >= 3) {
            drawState.points.push({ x: lx, y: ly });
            renderDrawStroke(drawState.points);
          }
          setCanvasCursor('crosshair');
          return;
        }

        const hit = pickSheep(e.clientX, e.clientY);
        hoveredSheep = hit;
        // Rub cursor gently over Golden Cat (without dragging) to pet it & make it purr!
        if (hit && hit.isCat && !hit.grabbed && !herdingEvent && hit.angerTimer <= 0 && hit.boltingTimer <= 0) {
          hit.petEnergy = Math.min(2.4, hit.petEnergy + 0.085);
          if (hit.petEnergy >= 0.65) {
            hit.purrTimer = 2.6;
          }
        }
        if (hit) {
          setCanvasCursor('pointer');
        } else {
          setCanvasCursor(camState.orbitEnabled ? 'grab' : 'default');
        }
      });

      canvas.addEventListener('pointerdown', (e) => {
        if (e.button !== 0 && e.pointerType === 'mouse') return;
        downPos = { x: e.clientX, y: e.clientY };
        const hitSheep = pickSheep(e.clientX, e.clientY);
        if (hitSheep) {
          grabState.candidate = hitSheep;
          grabState.active = false;
          grabState.originX = hitSheep.root.position.x;
          grabState.originZ = hitSheep.root.position.z;
          grabState.dropX = hitSheep.root.position.x;
          grabState.dropZ = hitSheep.root.position.z;
          grabState.validDrop = true;
          return;
        }

        if (camState.orbitEnabled) {
          camState.dragging = true;
          camState.lastX = e.clientX;
          camState.lastY = e.clientY;
          setCanvasCursor('grabbing');
        } else if (pickMeadowPoint(e.clientX, e.clientY)) {
          clearTimeout(drawState.fadeTimer);
          const rect = canvas.getBoundingClientRect();
          drawState.active = true;
          drawState.points = [{ x: e.clientX - rect.left, y: e.clientY - rect.top }];
          drawPathEl.classList.add('drawing');
          drawPathEl.setAttribute('d', '');
        }
      });

      window.addEventListener('pointerup', (e) => {
        if (grabState.candidate) {
          const sheep = grabState.candidate;
          const wasGrabbed = grabState.active;
          grabState.candidate = null;
          grabState.active = false;
          dropRingMesh.visible = false;

          if (wasGrabbed) {
            sheep.grabbed = false;
            if (grabState.validDrop) {
              sheep.root.position.x = grabState.dropX;
              sheep.root.position.z = grabState.dropZ;
            } else {
              sheep.root.position.x = grabState.originX;
              sheep.root.position.z = grabState.originZ;
              showToast(grabState.blockedByPen ? '羊这么可爱，不要这么残忍' : '河道或草地外不能放置，已放回原位');
            }
            sheep.dropSquash = 1.0;

            // Special handling when dropping the Golden Shaded cat
            if (sheep.isCat) {
              if (grabState.validDrop) {
                // Dropping the cat onto the red cottage roof -> sunbathe happily on the roof!
                if (isInsideHouseFootprint(sheep.root.position.x, sheep.root.position.z, 0.25)) {
                  sheep.angerTimer = 0;
                  sheep.boltingTimer = 0;
                  sheep.reefAction = null;
                  sheep.root.position.set(HOUSE_X, getTerrainHeight(HOUSE_X, HOUSE_Z) + 2.18, HOUSE_Z + 0.15);
                  sheep.onRoofTimer = 14.0;
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }

                // Dropping the cat onto the river reef rock -> happy perched fish-watching, never angry!
                if (isOnReef(sheep.root.position.x, sheep.root.position.z, 0.45)) {
                  sheep.angerTimer = 0;
                  sheep.angerTarget = null;
                  sheep.boltingTimer = 0;
                  sheep.root.position.set(REEF_X, REEF_TOP_Y, REEF_Z);
                  const bankSide = Math.random() < 0.5 ? 1 : -1;
                  sheep.reefAction = {
                    mode: 'sit',
                    phase: 'perched',
                    t: 0,
                    duration: 0.62,
                    startX: REEF_X, startY: REEF_TOP_Y, startZ: REEF_Z,
                    endX: REEF_X, endY: REEF_TOP_Y, endZ: REEF_Z,
                    targetBankSide: bankSide,
                    perchTimer: 6.5 + Math.random() * 3.0
                  };
                  if (fishList.length < MAX_RIVER_FISH && !fishList.some(f => Math.abs(f.z - REEF_Z) < 4.0)) {
                    const sp = spawnRiverFish(false);
                    sp.z = REEF_Z - sp.dir * 2.0;
                    sp.depth = 0.9;
                    sp.targetDepth = 1.0;
                  }
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }

                let nearestSh = null;
                let nearestD = 1.65;
                for (let j = 0; j < sheepList.length; j++) {
                  const sh = sheepList[j];
                  if (sh.deleting || sh.grabbed) continue;
                  const d = Math.hypot(
                    sh.root.position.x - sheep.root.position.x,
                    sh.root.position.z - sheep.root.position.z
                  );
                  if (d < nearestD) {
                    nearestD = d;
                    nearestSh = sh;
                  }
                }
                if (nearestSh) {
                  if (!herdingEvent && Math.random() < 0.45 && startHerdingEvent(nearestSh)) {
                    setCanvasCursor('default');
                    selectSheep(null);
                    return;
                  }
                  // Dropped on a sheep -> instantly catapult-leap & bolt away across the grass!
                  nearestSh.dropSquash = 0.9;
                  const ex = sheep.root.position.x - nearestSh.root.position.x;
                  const ez = sheep.root.position.z - nearestSh.root.position.z;
                  let escapeAng = Math.hypot(ex, ez) > 0.05
                    ? Math.atan2(ex, ez)
                    : Math.random() * Math.PI * 2;
                  if (isPositionBlocked(
                    sheep.root.position.x + Math.sin(escapeAng) * 2.2,
                    sheep.root.position.z + Math.cos(escapeAng) * 2.2,
                    0.1
                  )) {
                    escapeAng = computeSafeEscapeAngle(sheep.root.position.x, sheep.root.position.z, escapeAng);
                  }
                  sheep.root.rotation.y = escapeAng;
                  sheep.targetRotY = escapeAng;
                  sheep.boltingTimer = 1.65;
                  sheep.boltElapsed = 0;
                  sheep.avoidCooldown = 0;
                } else {
                  // Dropped directly onto the river reef rock -> sit right on top watching fish!
                  if (isOnReef(sheep.root.position.x, sheep.root.position.z, 0.35)) {
                    sheep.root.position.set(REEF_X, REEF_TOP_Y, REEF_Z);
                    const bankSide = Math.random() < 0.5 ? 1 : -1;
                    sheep.reefAction = {
                      mode: 'sit',
                      phase: 'perched',
                      t: 0,
                      duration: 0.62,
                      startX: REEF_X, startY: REEF_TOP_Y, startZ: REEF_Z,
                      endX: REEF_X, endY: REEF_TOP_Y, endZ: REEF_Z,
                      targetBankSide: bankSide,
                      perchTimer: 6.5 + Math.random() * 3.0
                    };
                    if (fishList.length < MAX_RIVER_FISH && !fishList.some(f => Math.abs(f.z - REEF_Z) < 4.0)) {
                      const sp = spawnRiverFish(false);
                      sp.z = REEF_Z - sp.dir * 2.0;
                      sp.depth = 0.9;
                      sp.targetDepth = 1.0;
                    }
                  } else {
                    const distReef = Math.hypot(sheep.root.position.x - REEF_X, sheep.root.position.z - REEF_Z);
                    if (distReef < 3.4) {
                      sheep.reefCooldown = 0;
                      sheep.state = 'Walk';
                    }
                  }
                  // Dropped near the riverbank: immediately allow fish-watching & ensure a fish is swimming nearby
                  const riverDist = Math.abs(sheep.root.position.x - getRiverCenterX(sheep.root.position.z)) - getRiverHalfWidth(sheep.root.position.z);
                  if (riverDist < 2.8 && !sheep.reefAction) {
                    sheep.watchCooldown = 0;
                    const hasNearFish = fishList.some(f => Math.abs(f.z - sheep.root.position.z) < 4.5);
                    if (!hasNearFish && fishList.length < MAX_RIVER_FISH) {
                      const spawned = spawnRiverFish(false);
                      spawned.z = Math.max(-SLAB_D / 2 + 1.5, Math.min(SLAB_D / 2 - 1.5, sheep.root.position.z - spawned.dir * 1.6));
                      spawned.depth = 0.85;
                      spawned.targetDepth = 1.0;
                    }
                  }
                }
              }
              setCanvasCursor('default');
              selectSheep(null);
              return;
            }

            // Check if dropped on or right next to the Golden Shaded cat -> ALWAYS triggers cat angry (💢) & sheep scared/embarrassed (💦)!
            if (grabState.validDrop && goldenCat) {
              const cdx = sheep.root.position.x - goldenCat.root.position.x;
              const cdz = sheep.root.position.z - goldenCat.root.position.z;
              const cdist = Math.hypot(cdx, cdz);
              if (cdist < 1.95) {
                if (!herdingEvent && Math.random() < 0.45 && startHerdingEvent(sheep)) {
                  setCanvasCursor('default');
                  selectSheep(null);
                  return;
                }
                // Nudge sheep cleanly to the edge of the cat so they never clip
                const nx = cdist > 0.01 ? cdx / cdist : 1;
                const nz = cdist > 0.01 ? cdz / cdist : 0;
                const safeX = goldenCat.root.position.x + nx * 1.24;
                const safeZ = goldenCat.root.position.z + nz * 1.24;
                if (!isPositionBlocked(safeX, safeZ, 0)) {
                  sheep.root.position.x = safeX;
                  sheep.root.position.z = safeZ;
                }
                goldenCat.angerTimer = 3.4;
                goldenCat.angerTarget = sheep;
                goldenCat.wakeStretchTimer = 0;
                goldenCat.disturbCooldown = 6.0;

                sheep.angerTimer = 0;
                sheep.vaultTime = 0;
                sheep.scaredTimer = 3.4;
                sheep.scaredTarget = goldenCat;

                setCanvasCursor('default');
                selectSheep(null);
                return;
              }
            }

            // If a grabbed sheep is dropped right beside the sheep pen -> immediately spooked & bolts away!
            if (grabState.validDrop && isInsidePen(sheep.root.position.x, sheep.root.position.z, 2.25)) {
              const awayX = sheep.root.position.x - PEN_X;
              const awayZ = sheep.root.position.z - PEN_Z;
              let runAng = Math.atan2(awayX - 0.6, awayZ + 0.9);
              if (isPositionBlocked(sheep.root.position.x + Math.sin(runAng) * 1.6, sheep.root.position.z + Math.cos(runAng) * 1.6, 0.05)) {
                runAng = computeSafeEscapeAngle(sheep.root.position.x, sheep.root.position.z, runAng);
              }
              sheep.root.rotation.y = runAng;
              sheep.targetRotY = runAng;
              sheep.angerTimer = 0;
              sheep.scaredTimer = 0;
              sheep.vaultTime = 0;
              sheep.fleePenTimer = 2.1;
              sheep.fleePenCooldown = 4.5;
              setCanvasCursor('default');
              selectSheep(null);
              return;
            }

            // Check if dropped right next to another sheep
            let nearestNeighbor = null;
            let nearestDist = 1.95;
            if (grabState.validDrop) {
              for (let j = 0; j < sheepList.length; j++) {
                const other = sheepList[j];
                if (other === sheep || other.deleting || other.grabbed || other.pairInteraction) continue;
                const d = Math.hypot(
                  other.root.position.x - sheep.root.position.x,
                  other.root.position.z - sheep.root.position.z
                );
                if (d < nearestDist) {
                  nearestDist = d;
                  nearestNeighbor = other;
                }
              }
            }

            if (nearestNeighbor) {
              const roll = Math.random();
              if (roll < 0.34) {
                // Scenario 1: Sweet head nuzzling + floating heart for 5s
                startPairInteraction(sheep, nearestNeighbor, 'love');
              } else if (roll < 0.68) {
                // Scenario 2: Fierce headbutt fight + swirling dust cloud for 5s
                startPairInteraction(sheep, nearestNeighbor, 'fight');
              } else {
                // Scenario 3: Angry glare reaction (neighbor gets squished & mad if dropped very close!)
                sheep.angerTimer = 3.2;
                sheep.angerLookTarget = null;
                sheep.targetRotY = Math.atan2(
                  camera.position.x - sheep.root.position.x,
                  camera.position.z - sheep.root.position.z
                );
                if (nearestDist < 1.35) {
                  nearestNeighbor.dropSquash = 1.0;
                  nearestNeighbor.angerTimer = 2.8;
                  nearestNeighbor.angerLookTarget = sheep;
                }
              }
            } else {
              sheep.angerTimer = 3.2;
              sheep.angerLookTarget = null;
              sheep.targetRotY = Math.atan2(
                camera.position.x - sheep.root.position.x,
                camera.position.z - sheep.root.position.z
              );
            }

            setCanvasCursor('default');
            selectSheep(null);
            return;
          }
        }

        if (camState.dragging) {
          camState.dragging = false;
          setCanvasCursor(camState.orbitEnabled ? 'grab' : 'default');
        }

        const moved = Math.hypot(e.clientX - downPos.x, e.clientY - downPos.y);

        if (drawState.active) {
          drawState.active = false;
          drawPathEl.classList.remove('drawing');
          const pts = drawState.points.slice();
          drawState.points = [];
          drawState.fadeTimer = setTimeout(() => drawPathEl.setAttribute('d', ''), 260);
          setCanvasCursor('default');

          if (moved >= 10) {
            trySpawnFromCircle(pts);
            return;
          }
        }

        if (e.target !== canvas) return;
        if (moved < 8) {
          const hit = pickSheep(e.clientX, e.clientY);
          if (hit) {
            selectSheep(hit);
            return;
          }
          // Check click on the red cottage -> toggle warm interior lights & puff a big chimney smoke ring!
          if (cottageHitMesh) {
            const rect = canvas.getBoundingClientRect();
            pointer.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            pointer.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
            raycaster.setFromCamera(pointer, camera);
            if (raycaster.intersectObject(cottageHitMesh, false).length > 0) {
              cottageLightsOn = !cottageLightsOn;
              if (cottageWindowMat) {
                cottageWindowMat.color.setHex(cottageLightsOn ? 0xfde68a : 0x8ba3b8);
                cottageWindowMat.emissiveIntensity = cottageLightsOn ? (weatherMode === 'sunset' ? 0.85 : 0.30) : 0.0;
              }
              if (cottageWarmLight) {
                cottageWarmLight.intensity = cottageLightsOn ? (weatherMode === 'sunset' ? 1.4 : 0.35) : 0.0;
              }
              // Puff a big playful chimney smoke ring!
              const rMat = new THREE.MeshBasicMaterial({ color: 0xffffff, transparent: true, opacity: 0.82, side: THREE.DoubleSide });
              const ring = new THREE.Mesh(new THREE.TorusGeometry(0.18, 0.06, 8, 18), rMat);
              ring.rotation.x = Math.PI / 2;
              ring.position.set(HOUSE_X + 0.62, getTerrainHeight(HOUSE_X, HOUSE_Z) + 2.45, HOUSE_Z - 0.32);
              dioramaGroup.add(ring);
              extraSmokeRings.push({ mesh: ring, life: 0, maxLife: 2.2 });
              selectSheep(null);
              return;
            }
          }
          // Check click directly on the river -> splash water ripple & spook nearby fish!
          const gPt = raycastGroundRaw(e.clientX, e.clientY);
          if (gPt && isInRiver(gPt.x, gPt.z, 0.05) && !isOnBridge(gPt.x, gPt.z, 0.1) && !isOnReef(gPt.x, gPt.z, 0.1)) {
            spawnWaterRipple(gPt.x, gPt.z, 3.2);
            fishList.forEach(f => {
              const d = Math.hypot(f.group.position.x - gPt.x, f.group.position.z - gPt.z);
              if (d < 3.6) {
                f.spookTimer = 1.9;
                f.targetDepth = 0.0; // dive down toward deep silhouette!
              }
            });
          }
          selectSheep(null);
        }
      });

      canvas.addEventListener('wheel', (e) => {
        if (!camState.orbitEnabled) return;
        e.preventDefault();
        camState.radius = Math.max(42, Math.min(108, camState.radius + e.deltaY * 0.03));
        updateCameraTransform();
      }, { passive: false });

      // ------------------------------------------------------------------
      // 10. Toolbar & Demo Button Event Handlers
      // ------------------------------------------------------------------
      stateButtons.forEach(btn => {
        btn.addEventListener('click', (e) => {
          e.stopPropagation();
          if (!selectedSheep) return;
          clearAutoDeselect();
          selectedSheep.state = btn.dataset.state;
          if (selectedSheep.state === 'Jump') {
            selectedSheep.jumpPhase = 'hop';
            selectedSheep.jumpTime = 0;
          } else if (selectedSheep.state === 'Graze') {
            if (canGrazeAt(selectedSheep.root.position.x, selectedSheep.root.position.z, selectedSheep.root.rotation.y)) {
              selectedSheep.grazePhase = 'eat';
              selectedSheep.grazeTimer = 3.0;
              selectedSheep.nibbleFxTimer = 0.12;
            } else {
              selectedSheep.grazePhase = 'walk';
              selectedSheep.grazeTimer = 0.5;
            }
          } else if (selectedSheep.state === 'Idle') {
            selectedSheep.idleMode = 'lookup';
            selectedSheep.idleTimer = 3.2;
          } else if (selectedSheep.isCat) {
            selectedSheep.angerTimer = 0;
            selectedSheep.wakeStretchTimer = 0;
            selectedSheep.watchFish = null;
            selectedSheep.reefAction = null;
            selectedSheep.stateTimer = selectedSheep.state === 'Sleep'
              ? (30 + Math.random() * 15)
              : 8.5;
          }
          syncToolbarActiveButton();
        });
      });

      btnRotate.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        selectedSheep.targetRotY += Math.PI / 2;
      });

      btnReset.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        selectedSheep.state = 'Graze';
        selectedSheep.jumpTime = 0;
        selectedSheep.targetRotY = 0;
        syncToolbarActiveButton();
      });

      btnDuplicate.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        if (sheepList.length >= 24) {
          showToast('草地最多容纳 24 只小羊');
          return;
        }
        const angle = Math.random() * Math.PI * 2;
        let nx = selectedSheep.root.position.x + Math.cos(angle) * 1.45;
        let nz = selectedSheep.root.position.z + Math.sin(angle) * 1.45;
        nx = Math.max(TERRAIN_MIN_X + 1.5, Math.min(TERRAIN_MAX_X - 1.5, nx));
        nz = Math.max(-SLAB_D / 2 + 1.5, Math.min(SLAB_D / 2 - 1.5, nz));
        if (isInRiver(nx, nz, 0.7)) nx += 2.6;
        const clone = createSheep(nx, nz, selectedSheep.targetRotY + 0.3, selectedSheep.state);
        selectSheep(clone);
      });

      btnDelete.addEventListener('click', (e) => {
        e.stopPropagation();
        if (!selectedSheep) return;
        selectedSheep.deleting = true;
        selectedSheep = null;
        updateSelectionUI();
      });

      function applyWeatherMode(mode) {
        weatherMode = mode;
        const cfg = WEATHER_MODES.find(m => m.id === mode) || WEATHER_MODES[0];
        btnWeather.textContent = cfg.label;
        document.body.style.background = cfg.bg;
        rainGroup.visible = mode === 'rain';

        if (mode === 'sunny') {
          hemiLight.color.setHex(0xfffef8);
          hemiLight.groundColor.setHex(0xb8cf8a);
          hemiLight.intensity = 0.88;
          dirLight.color.setHex(0xfff8e6);
          dirLight.intensity = 0.92;
          dirLight.position.set(20, 26, -12);
          if (cottageWindowMat && cottageLightsOn) cottageWindowMat.emissiveIntensity = 0.28;
          if (cottageWarmLight) cottageWarmLight.intensity = 0.0;
        } else if (mode === 'sunset') {
          hemiLight.color.setHex(0xffd6a5);
          hemiLight.groundColor.setHex(0x8e7c5a);
          hemiLight.intensity = 0.76;
          dirLight.color.setHex(0xff9b54);
          dirLight.intensity = 1.12;
          dirLight.position.set(26, 14, -18);
          if (cottageWindowMat && cottageLightsOn) cottageWindowMat.emissiveIntensity = 0.90;
          if (cottageWarmLight && cottageLightsOn) cottageWarmLight.intensity = 1.5;
        } else {
          // Gentle breezy light rain
          hemiLight.color.setHex(0xdbe8f0);
          hemiLight.groundColor.setHex(0x8fa882);
          hemiLight.intensity = 0.84;
